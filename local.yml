---
- name: Bootstrap development environment
  hosts: localhost
  connection: local
  vars:
    src_gh_hosts: "./hosts.yml"
    src_gh_config: "./encrypt-data/config.yml"
  pre_tasks:
    - name: Run preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
    - name: Update Apt
      become: true
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        state: present
      tags:
        - install
        - core
  environment:
    CARGO_HOME: "{{ cargo_home | default(ansible_env.HOME + '/.local/share/cargo') }}"
    RUSTUP_HOME: "{{ rustup_home | default(ansible_env.HOME + '/.local/share/rustup') }}"
    N_PREFIX: "{{ n_prefix | default(ansible_env.HOME + '/.local/share/n') }}"
    NPM_CONFIG_USERCONFIG: "{{ npm_config_userconfig | default(ansible_env.HOME + '/.config/npm/npmrc') }}"
  roles:
    - role: docker
      tags:
        - install
        - docker
    - role: core
      tags:
        - install
        - core
    - role: dotfiles
      tags:
        - install
        - dotfiles
    - role: gpg
      tags:
        - install
        - gpg
    - role: regolith
      tags:
        - install
        - regolith
    - role: rust
      tags:
        - install
        - rust
    - role: python
      tags:
        - install
        - python
    - role: go
      tags:
        - install
        - go
    - role: node
      tags:
        - install
        - node
    - role: neovim
      tags:
        - install
        - neovim
    - role: tmux
      tags:
        - install
        - tmux
    - role: gh
      vars:
        gh_config_src: "{{ src_gh_config }}"
        gh_hosts_src: "{{ src_gh_hosts }}"
      tags:
        - install
        - gh
    - role: i3blocks
      tags:
        - install
        - i3blocks
  tasks:
    - name: Setup productivity tools
      ansible.builtin.import_tasks: tasks/productivity-tools.yml
    - name: Setup kubectl
      ansible.builtin.import_tasks: tasks/kubectl-setup.yml
    - name: Setup HashiCorp Vault
      ansible.builtin.import_tasks: tasks/vault-setup.yml
    - name: Setup ZSH and shell environment
      ansible.builtin.import_tasks: tasks/zsh-setup.yml
    - name: Clone repositories in parallel
      ansible.builtin.import_tasks: tasks/parallel-clones.yml
    # - name: Setup st terminal
    #   ansible.builtin.import_tasks: tasks/st-setup.yml
    # - name: Setup eww
    #   ansible.builtin.import_tasks: tasks/eww-setup.yml
    - name: Setup gopass
      ansible.builtin.import_tasks: tasks/gopass-setup.yml
    - name: Setup Brave browser
      ansible.builtin.import_tasks: tasks/brave-setup.yml
    # - name: Setup Slack
    #   ansible.builtin.import_tasks: tasks/slack-setup.yml
    # - name: Setup projects
    #   ansible.builtin.import_tasks: tasks/projects-setup.yml
  post_tasks:
    - name: Upgrade Apt
      become: true
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        upgrade: true
        state: present
      tags:
        - install
        - core
