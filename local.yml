---
- name: Bootstrap development environment
  hosts: localhost
  connection: local
  vars:
    src_gh_hosts: "./hosts.yml"
    src_gh_config: "./encrypt-data/config.yml"
  pre_tasks:
    - name: Run preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
    - name: Update Apt
      become: true
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        state: present
      tags:
        - install
        - core
  environment:
    XDG_CONFIG_HOME: "{{ ansible_env.HOME }}/.config"
    XDG_DATA_HOME: "{{ ansible_env.HOME }}/.local/share"
    XDG_CACHE_HOME: "{{ ansible_env.HOME }}/.cache"
    XDG_STATE_HOME: "{{ ansible_env.HOME }}/.local/state"
    CARGO_HOME: "{{ cargo_home | default(ansible_env.HOME + '/.local/share/cargo') }}"
    RUSTUP_HOME: "{{ rustup_home | default(ansible_env.HOME + '/.local/share/rustup') }}"
    N_PREFIX: "{{ n_prefix | default(ansible_env.HOME + '/.local/share/n') }}"
    NPM_CONFIG_USERCONFIG: "{{ npm_config_userconfig | default(ansible_env.HOME + '/.config/npm/npmrc') }}"
  roles:
    - role: docker
      tags:
        - install
        - docker
    - role: core
      tags:
        - install
        - core
    - role: dotfiles
      tags:
        - install
        - dotfiles
    - role: gpg
      tags:
        - install
        - gpg
    - role: rust
      tags:
        - install
        - rust
        - rust-update
        - update
    - role: python
      tags:
        - install
        - python
        - python-update
        - update
    - role: go
      tags:
        - install
        - go
        - go-update
        - update
    - role: node
      tags:
        - install
        - node
        - node-update
        - update
    - role: zig
      tags:
        - install
        - zig
        - zig-update
        - update
    - role: neovim
      tags:
        - install
        - neovim
        - neovim-update
        - update
    - role: tmux
      tags:
        - install
        - tmux
        - tmux-update
        - update
    - role: gh
      vars:
        gh_config_src: "{{ src_gh_config }}"
        gh_hosts_src: "{{ src_gh_hosts }}"
      tags:
        - install
        - gh
    - role: i3blocks
      tags:
        - install
        - i3blocks
        - i3blocks-update
        - update
    - role: zsh
      tags:
        - install
        - zsh
    - role: kubectl
      tags:
        - install
        - kubectl
    - role: vault
      tags:
        - install
        - vault
    - role: gopass
      vars:
        gopass_store_repo: "https://github.com/joellidin/private-pass.git"
      tags:
        - install
        - gopass
        - gopass-update
        - update
    - role: browser
      tags:
        - install
        - browser
        - zen-update
        - update
    - role: ghostty
      tags:
        - install
        - ghostty
        - ghostty-update
        - update
    - role: picom
      tags:
        - install
        - picom
        - picom-update
        - update
    - role: claude_code
      tags:
        - install
        - claude-code
        - claude-code-update
        - update
    - role: herdr
      tags:
        - install
        - herdr
        - herdr-update
        - update
    - role: delta
      tags:
        - install
        - delta
        - delta-update
        - update
  tasks:
    - name: Setup productivity tools
      ansible.builtin.import_tasks: tasks/productivity-tools.yml
    - name: Clone repositories in parallel
      ansible.builtin.import_tasks: tasks/parallel-clones.yml
  post_tasks:
    - name: Upgrade Apt
      become: true
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        upgrade: true
        state: present
      tags:
        - install
        - core
