---
- name: Bootstrap development environment
  hosts: localhost
  connection: local
  pre_tasks:
    - name: Run preflight checks
      ansible.builtin.import_tasks: tasks/preflight.yml
    - name: Update apt cache and install the deb822 repository prerequisite
      become: true
      ansible.builtin.apt:
        name: python3-debian
        state: present
        update_cache: true
      when: ansible_facts['os_family'] == 'Debian'
      tags:
        - always
  environment:
    XDG_CONFIG_HOME: "{{ config_home }}"
    XDG_DATA_HOME: "{{ local_share }}"
    XDG_CACHE_HOME: "{{ cache_home }}"
    XDG_STATE_HOME: "{{ local_state }}"
    CARGO_HOME: "{{ cargo_home }}"
    RUSTUP_HOME: "{{ rustup_home }}"
  # Role tags select whole roles (`--tags neovim`). Tasks that belong to the
  # update flow carry `update` and `<role>-update` themselves, so
  # `--tags update` runs only those.
  roles:
    - role: docker
      tags:
        - install
        - docker
    - role: core
      tags:
        - install
        - core
    - role: dotfiles
      tags:
        - install
        - dotfiles
    - role: gpg
      tags:
        - install
        - gpg
    - role: mise
      tags:
        - install
        - mise
    - role: rust
      tags:
        - install
        - rust
    - role: python
      tags:
        - install
        - python
    - role: neovim
      tags:
        - install
        - neovim
    - role: tmux
      tags:
        - install
        - tmux
    - role: i3blocks
      tags:
        - install
        - i3blocks
    - role: zsh
      tags:
        - install
        - zsh
    - role: gopass
      tags:
        - install
        - gopass
    - role: browser
      tags:
        - install
        - browser
    - role: ghostty
      tags:
        - install
        - ghostty
    - role: picom
      tags:
        - install
        - picom
    - role: i3lock_color
      tags:
        - install
        - i3lock_color
    - role: desktop
      tags:
        - install
        - desktop
    - role: claude_code
      tags:
        - install
        - claude-code
    - role: herdr
      tags:
        - install
        - herdr
  post_tasks:
    - name: Upgrade apt packages
      become: true
      ansible.builtin.apt:
        upgrade: safe
      when: ansible_facts['os_family'] == 'Debian'
      tags:
        - install
        - core
