---
- hosts: localhost
  connection: local
  vars:
    src_gh_hosts: "./hosts.yml"
    src_gh_config: "./encrypt-data/config.yml"
  pre_tasks:
    - ansible.builtin.import_tasks: tasks/preflight.yml
    - name: Update Apt
      become: true
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        state: present
      tags:
        - install
        - core
  environment:
    CARGO_HOME: "{{ cargo_home | default(ansible_env.HOME + '/.local/share/cargo') }}"
    RUSTUP_HOME: "{{ rustup_home | default(ansible_env.HOME + '/.local/share/rustup') }}"
    N_PREFIX: "{{ n_prefix | default(ansible_env.HOME + '/.local/share/n') }}"
    NPM_CONFIG_USERCONFIG: "{{ npm_config_userconfig | default(ansible_env.HOME + '/.config/npm/npmrc') }}"
  roles:
    - role: docker
      tags:
        - install
        - docker
  tasks:
    - ansible.builtin.import_tasks: tasks/productivity-tools.yml
    - ansible.builtin.import_tasks: tasks/core-setup.yml
    - ansible.builtin.import_tasks: tasks/kubectl-setup.yml
    - ansible.builtin.import_tasks: tasks/vault-setup.yml
    - ansible.builtin.import_tasks: tasks/zsh-setup.yml
    - ansible.builtin.import_tasks: tasks/rust-setup.yml
    - ansible.builtin.import_tasks: tasks/python-setup.yml
    - ansible.builtin.import_tasks: tasks/node-setup.yml
    - ansible.builtin.import_tasks: tasks/go-setup.yml
    - ansible.builtin.import_tasks: tasks/dotfiles.yml
    - ansible.builtin.import_tasks: tasks/parallel-clones.yml
    - ansible.builtin.import_tasks: tasks/nvim-setup.yml
    # - import_tasks: tasks/st-setup.yml
    - ansible.builtin.import_tasks: tasks/i3blocks-setup.yml
    # - import_tasks: tasks/eww-setup.yml
    - ansible.builtin.import_tasks: tasks/tmux-setup.yml
    - ansible.builtin.import_tasks: tasks/gh-setup.yml
    - ansible.builtin.import_tasks: tasks/gopass-setup.yml
    - ansible.builtin.import_tasks: tasks/brave-setup.yml
    # - import_tasks: tasks/slack-setup.yml
    # - import_tasks: tasks/projects-setup.yml
  post_tasks:
    - name: Upgrade Apt
      become: true
      ansible.builtin.apt:
        force_apt_get: true
        update_cache: true
        upgrade: true
        state: present
      tags:
        - install
        - core
