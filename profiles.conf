# profiles.conf: what bootstrap.sh offers in its TUI.
#
# Pipe-delimited, "#" starts a comment, blank lines are ignored, spaces around
# fields are trimmed. Two kinds of lines:
#
#   roles|<os>|<role tags>
#     The role catalogue for an OS (linux or darwin). Screen 2 of the TUI
#     offers exactly these roles, "ALL" in a profile expands to them, and
#     "bootstrap.sh update" skips every catalogue role you did not select.
#     Keep each list in sync with the role tags in local.yml.
#
#   <name>|<os list>|<description>|<role tags or ALL>
#     A profile. <os list> is a comma separated subset of linux,darwin; the
#     profile is hidden on other systems. Role tags are space separated and
#     must appear in that OS's catalogue. Selected roles become
#     "ansible-playbook --tags <roles>".

roles|linux|core dotfiles gpg mise rust python neovim tmux i3blocks zsh docker gopass browser ghostty picom i3lock_color desktop claude-code herdr
roles|darwin|core dotfiles gpg mise rust python neovim tmux zsh claude-code

workstation|linux|Full i3 workstation|ALL
dev|linux,darwin|Shell, editor, languages, no desktop|core dotfiles gpg mise rust python neovim tmux zsh claude-code
server|linux|Headless server|core dotfiles mise zsh tmux neovim docker python
mac|darwin|MacBook|core dotfiles gpg mise rust python neovim tmux zsh claude-code
