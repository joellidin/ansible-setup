[defaults]
# Inventory: the playbook only ever targets the local machine
inventory = inventory/localhost.yml

# Paths
roles_path = roles
collections_path = collections

# Performance and output
stdout_callback = default
callback_result_format = yaml
callbacks_enabled = ansible.posix.profile_tasks
inject_facts_as_vars = False
host_key_checking = False
retry_files_enabled = False

# Facts are gathered on every run: a cached distribution_release or
# distribution_version from before an OS upgrade would steer repo suites and
# release-asset selection wrong.
gathering = implicit

# Increase parallelism
forks = 10

# Reduce SSH connection overhead
pipelining = True

[privilege_escalation]
become = False
become_method = sudo
become_ask_pass = False

[ssh_connection]
pipelining = True
