---
# GitHub CLI role - installs gh and configures authentication

- name: Check if GitHub CLI GPG key exists
  ansible.builtin.stat:
    path: "{{ gh_keyring_path }}"
  register: gh_gpg_key
  tags:
    - install
    - gh

- name: Download GitHub CLI GPG key
  become: true
  ansible.builtin.get_url:
    url: https://cli.github.com/packages/githubcli-archive-keyring.gpg
    dest: "{{ gh_keyring_path }}"
    mode: "0644"
  when: not gh_gpg_key.stat.exists
  tags:
    - install
    - gh

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: gh_dpkg_arch
  changed_when: false
  tags:
    - install
    - gh

- name: Add GitHub CLI apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ gh_dpkg_arch.stdout }} signed-by={{ gh_keyring_path }}]
      https://cli.github.com/packages stable main
    filename: github-cli
    state: present
  tags:
    - install
    - gh

- name: Install GitHub CLI
  become: true
  ansible.builtin.apt:
    name: gh
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - gh

- name: Create gh config directory
  ansible.builtin.file:
    path: "{{ gh_config_dir }}"
    state: directory
    mode: "0700"
  tags:
    - install
    - gh

- name: Add gh config.yml
  ansible.builtin.copy:
    src: "{{ gh_config_src }}"
    dest: "{{ gh_config_dir }}/config.yml"
    mode: "0600"
  when: gh_config_src is defined
  tags:
    - install
    - gh

- name: Add gh hosts.yml
  ansible.builtin.copy:
    src: "{{ gh_hosts_src }}"
    dest: "{{ gh_config_dir }}/hosts.yml"
    mode: "0600"
  when: gh_hosts_src is defined
  tags:
    - install
    - gh
