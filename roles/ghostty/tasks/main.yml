---
# Ghostty role - installs Ghostty terminal via deb package

- name: Check if Ghostty is installed
  ansible.builtin.command: ghostty --version
  register: ghostty_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - install
    - ghostty
    - ghostty-update
    - update

- name: Get latest Ghostty release info
  ansible.builtin.uri:
    timeout: 60
    url: "https://api.github.com/repos/{{ ghostty_ubuntu_repo }}/releases/latest"
    return_content: true
    headers: "{{ github_api_headers }}"
  register: ghostty_release
  until: ghostty_release is succeeded
  retries: 5
  delay: 10
  tags:
    - install
    - ghostty
    - ghostty-update
    - update

- name: Determine if Ghostty needs install or update
  ansible.builtin.set_fact:
    ghostty_needs_install: >-
      {{ ghostty_installed.rc != 0
         or ghostty_installed.stdout_lines[0].split()[-1] not in ghostty_release.json.tag_name }}
  tags:
    - install
    - ghostty
    - ghostty-update
    - update

- name: Set Ghostty deb URL
  ansible.builtin.set_fact:
    ghostty_deb_url: >-
      {{ ghostty_release.json.assets
         | selectattr('name', 'match', '.*_' ~ ghostty_arch ~ '_' ~ distro_version ~ '\.deb$')
         | map(attribute='browser_download_url')
         | first }}
    ghostty_deb_name: >-
      {{ ghostty_release.json.assets
         | selectattr('name', 'match', '.*_' ~ ghostty_arch ~ '_' ~ distro_version ~ '\.deb$')
         | map(attribute='name')
         | first }}
  when: ghostty_needs_install
  tags:
    - install
    - ghostty
    - ghostty-update
    - update

- name: Download Ghostty deb package
  ansible.builtin.get_url:
    timeout: 60
    url: "{{ ghostty_deb_url }}"
    dest: "{{ ghostty_download_dir }}/{{ ghostty_deb_name }}"
    mode: "0644"
  when: ghostty_needs_install
  register: ghostty_deb_download
  until: ghostty_deb_download is succeeded
  retries: 3
  delay: 5
  tags:
    - install
    - ghostty
    - ghostty-update
    - update

- name: Install Ghostty deb package
  become: true
  ansible.builtin.apt:
    deb: "{{ ghostty_download_dir }}/{{ ghostty_deb_name }}"
    state: present
  when: ghostty_needs_install
  tags:
    - install
    - ghostty
    - ghostty-update
    - update

- name: Clean up Ghostty deb package
  ansible.builtin.file:
    path: "{{ ghostty_download_dir }}/{{ ghostty_deb_name }}"
    state: absent
  when: ghostty_needs_install
  tags:
    - install
    - ghostty
    - ghostty-update
    - update
