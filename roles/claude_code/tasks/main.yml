---
# Claude Code role - installs Claude Code CLI

- name: Check if Claude Code is installed
  ansible.builtin.command: "{{ claude_code_bin }} --version"
  register: claude_code_installed
  changed_when: false
  failed_when: false
  tags:
    - install
    - claude-code

- name: Create cache directory
  ansible.builtin.file:
    path: "{{ claude_code_cache_dir }}"
    state: directory
    mode: "0755"
  when: claude_code_installed.rc != 0
  tags:
    - install
    - claude-code

- name: Download Claude Code installer
  ansible.builtin.get_url:
    url: "{{ claude_code_install_url }}"
    dest: "{{ claude_code_cache_dir }}/install.sh"
    mode: "0755"
  when: claude_code_installed.rc != 0
  tags:
    - install
    - claude-code

- name: Install Claude Code
  ansible.builtin.command:
    cmd: "{{ claude_code_cache_dir }}/install.sh"
  when: claude_code_installed.rc != 0
  register: claude_code_install
  changed_when: claude_code_install.rc == 0
  tags:
    - install
    - claude-code

- name: Clean up installer
  ansible.builtin.file:
    path: "{{ claude_code_cache_dir }}/install.sh"
    state: absent
  when: claude_code_installed.rc != 0
  tags:
    - install
    - claude-code

- name: Update Claude Code
  ansible.builtin.command:
    cmd: "{{ claude_code_bin }} update"
  when: claude_code_installed.rc == 0
  register: claude_code_update
  changed_when: "'Updated' in claude_code_update.stdout"
  failed_when: false
  tags:
    - claude-code-update
    - update
