---
# Desktop role - git from the git-core PPA plus the i3/X11 desktop tool set.
# deb822_repository rather than apt_repository: the latter is deprecated and
# its PPA key import via apt-key no longer works on Ubuntu 26.04 (apt 3.x).

- name: Add git-core PPA
  become: true
  ansible.builtin.deb822_repository:
    name: git-core-ubuntu-ppa
    types: deb
    uris: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu/
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    # The key ships with the role (verified against the fingerprint in
    # defaults). Fetching it from the keyserver on every run was not
    # idempotent: the keyserver does not always return identical key blocks.
    signed_by: "{{ lookup('ansible.builtin.file', 'git-core-ppa.asc') }}"
    state: present
  register: desktop_git_ppa
  tags:
    - install
    - desktop

- name: Refresh apt cache after adding the git-core PPA
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: desktop_git_ppa.changed
  tags:
    - install
    - desktop

- name: Install desktop packages
  become: true
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - desktop

- name: Workstation tidy-up and per-model kernel options
  ansible.builtin.import_tasks: workstation.yml

- name: Use the OpenSSH agent instead of GNOME's
  ansible.builtin.import_tasks: ssh-agent.yml

# Synaptics 06cb:0106 on libfprint 1.95.1 has three problems:
#   - a scan still running when the laptop sleeps never recovers after resume,
#     so fprint-sleep.service stops fprintd before sleep. Its drop-in runs
#     fprint-sleep-check, which stops it only while a scan is running: a
#     resume that starts fprintd cold loses an unlock in the first ~0.5 s;
#   - a scan that starts within a second of fprintd starting is lost (the sensor
#     sees the finger but fprintd never reports a result), which is what
#     happened when the lock screen D-Bus-activated fprintd. So fprintd stays
#     resident (no-timeout drop-in) and fprintd-warm.service starts it at boot
#     and right after resume, before anyone presses Enter on the lock screen;
#   - a scan stopped while it is still running jams the sensor, and every
#     unlock fails until fprintd restarts. fprintd-unjam.service follows the
#     journal and restarts fprintd when pam_fprintd reports the jam.
- name: Look for a fingerprint sensor that needs the fprintd workarounds
  ansible.builtin.command: lsusb -d {{ item }}
  loop: "{{ desktop_fprint_sleep_sensors }}"
  register: desktop_fprint_sensor
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - install
    - desktop

- name: Apply the fprintd workarounds for this fingerprint sensor
  when: desktop_fprint_sensor.results | selectattr('rc', 'equalto', 0) | list | length > 0
  become: true
  tags:
    - install
    - desktop
  block:
    - name: Create the directory for the fprintd helper scripts
      ansible.builtin.file:
        path: /usr/local/libexec
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the sleep check and unjam scripts
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /usr/local/libexec/{{ item }}
        owner: root
        group: root
        mode: "0755"
      loop:
        - fprint-sleep-check
        - fprintd-unjam
      register: desktop_fprint_scripts

    - name: Install the units that stop fprintd before sleep, start it after and unjam it
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: /etc/systemd/system/{{ item }}
        owner: root
        group: root
        mode: "0644"
      loop:
        - fprint-sleep.service
        - fprintd-warm.service
        - fprintd-unjam.service
      register: desktop_fprint_units

    - name: Create the fprintd and fprint-sleep drop-in directories
      ansible.builtin.file:
        path: /etc/systemd/system/{{ item }}.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop:
        - fprintd.service
        - fprint-sleep.service

    - name: Keep fprintd running instead of exiting when idle
      ansible.builtin.copy:
        src: fprintd-no-timeout.conf
        dest: /etc/systemd/system/fprintd.service.d/no-timeout.conf
        owner: root
        group: root
        mode: "0644"
      register: desktop_fprintd_dropin

    - name: Stop fprintd before sleep only while a scan is running
      ansible.builtin.copy:
        src: fprint-sleep-only-when-scanning.conf
        dest: /etc/systemd/system/fprint-sleep.service.d/only-when-scanning.conf
        owner: root
        group: root
        mode: "0644"
      register: desktop_fprint_sleep_dropin

    - name: Enable the fprintd sleep and warm-up units
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        daemon_reload: >-
          {{ desktop_fprint_units.changed or desktop_fprintd_dropin.changed
             or desktop_fprint_sleep_dropin.changed }}
      loop:
        - fprint-sleep.service
        - fprintd-warm.service

    # Restarted when its unit or script changed, so it runs the new copy.
    - name: Run the watcher that restarts fprintd when the sensor jams
      ansible.builtin.systemd_service:
        name: fprintd-unjam.service
        enabled: true
        state: >-
          {{ 'restarted'
             if (desktop_fprint_units.results + desktop_fprint_scripts.results)
                | selectattr('item', 'match', '^fprintd-unjam') | selectattr('changed') | list
             else 'started' }}

    - name: Restart fprintd so it picks up the no-timeout drop-in
      ansible.builtin.systemd_service:
        name: fprintd.service
        state: restarted
      when: desktop_fprintd_dropin.changed
