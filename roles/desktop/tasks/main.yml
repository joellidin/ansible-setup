---
# Desktop role - git from the git-core PPA plus the i3/X11 desktop tool set.
# deb822_repository rather than apt_repository: the latter is deprecated and
# its PPA key import via apt-key no longer works on Ubuntu 26.04 (apt 3.x).

- name: Add git-core PPA
  become: true
  ansible.builtin.deb822_repository:
    name: git-core-ubuntu-ppa
    types: deb
    uris: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu/
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    # The key ships with the role (verified against the fingerprint in
    # defaults). Fetching it from the keyserver on every run was not
    # idempotent: the keyserver does not always return identical key blocks.
    signed_by: "{{ lookup('ansible.builtin.file', 'git-core-ppa.asc') }}"
    state: present
  register: desktop_git_ppa
  tags:
    - install
    - desktop

- name: Refresh apt cache after adding the git-core PPA
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: desktop_git_ppa.changed
  tags:
    - install
    - desktop

- name: Install desktop packages
  become: true
  ansible.builtin.apt:
    name: "{{ desktop_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - desktop
