---
# Desktop role defaults: the i3/X11 desktop packages and the git-core PPA.

# Launchpad PPA for current git releases. files/git-core-ppa.asc is its
# signing key; this fingerprint (from
# https://launchpad.net/api/1.0/~git-core/+archive/ubuntu/ppa) is the one to
# check it against if the key ever needs replacing:
#   gpg --show-keys roles/desktop/files/git-core-ppa.asc
desktop_git_ppa_fingerprint: F911AB184317630C59970973E363C90F8F1B6217

desktop_packages:
  - i3
  - rofi
  - xcape
  - xdotool
  - xclip
  - xwallpaper
  - unclutter
  - maim
  - ffmpeg
  - imagemagick
  - acpi
  - jq
  - fzf
  - ripgrep
  - fd-find
  - plocate
  - sqlite3
  - libsqlite3-dev
  - git
  - autotiling          # started by a user unit from the dotfiles
  - policykit-1-gnome   # polkit agent that i3 starts; lets pkexec prompt
  - dunst
  - libsecret-1-dev     # to build git's keyring credential helper (below)
  - libnotify-bin       # notify-send, for the "Touch your YubiKey" notice
  - pciutils            # lspci, to look for the USB-C controllers (below)

# apt-fast's Launchpad PPA (tasks/apt-fast.yml). files/apt-fast-ppa.asc is its
# signing key; this fingerprint (from
# https://launchpad.net/api/1.0/~apt-fast/+archive/ubuntu/stable) is the one to
# check it against if the key ever needs replacing:
#   gpg --show-keys roles/desktop/files/apt-fast-ppa.asc
desktop_apt_fast_ppa_fingerprint: BC5934FD3DEBD4DAEA544F791E2824A7F22B44BD
# The files add-apt-repository creates for the same PPA.
desktop_apt_fast_legacy_sources:
  - /etc/apt/sources.list.d/apt-fast-ubuntu-stable-{{ distro_release }}.sources
  - /etc/apt/sources.list.d/apt-fast-ubuntu-stable-{{ distro_release }}.list
# apt-fast's debconf answers, as set on the ZBook on 2026-11-07: plain apt as the
# package manager, 10 parallel downloads, and no confirmation before downloading
# (DOWNLOADBEFORE empty). The other questions keep their defaults.
desktop_apt_fast_debconf:
  - {question: apt-fast/aptmanager, vtype: select, value: apt}
  - {question: apt-fast/maxdownloads, vtype: string, value: "10"}
  - {question: apt-fast/dlflag, vtype: boolean, value: "false"}

# The dotfiles' drop-in that keeps yubikey-touch-detector away from the OpenSSH
# agent socket; the package is installed only when it exists
# (tasks/yubikey-touch.yml).
desktop_touch_detector_dropin: >-
  {{ config_home }}/systemd/user/yubikey-touch-detector.service.d/no-ssh-proxy.conf

# User units masked so the OpenSSH agent is the session agent (tasks/ssh-agent.yml).
desktop_masked_user_units:
  - gcr-ssh-agent.socket
  - gcr-ssh-agent.service
  # gpg-agent serves an SSH socket even without enable-ssh-support. It offers
  # only the YubiKey's gpg auth key, yet herdr can pick it as the pane agent.
  # gpg signing uses gpg-agent's main socket and is unaffected.
  - gpg-agent-ssh.socket

# USB fingerprint sensors (vendor:product) that need the fprintd workarounds
# in tasks/main.yml: fprintd stopped before sleep while a scan is running (a
# scan that spans a suspend never recovers), kept running otherwise (a scan
# that starts together with fprintd is lost), and restarted when the sensor
# jams (a scan stopped while running).
desktop_fprint_sleep_sensors:
  - "06cb:0106"  # Synaptics, HP ZBook Ultra G1a (libfprint 1.95.1, Ubuntu 26.04)

# PCI controllers (vendor:device) kept out of D3cold by
# files/80-usbc-xhci-no-d3cold.rules, which matches the same IDs. The rule is
# installed only where one of them is present.
desktop_usbc_no_d3cold_controllers:
  - "1022:1589"  # Strix Halo USB-C xHCI (HP ZBook Ultra G1a): failed to wake from D3cold
  - "1022:158b"  # Strix Halo USB-C xHCI, second controller

# git's libsecret credential helper, built from the source that ships with the
# git package. The dotfiles' git config uses it (`helper = libsecret`).
desktop_git_libsecret_src: /usr/share/doc/git/contrib/credential/libsecret
desktop_git_libsecret_build_dir: "{{ cache_home }}/git-credential-libsecret"
desktop_git_libsecret_bin: "{{ local_bin }}/git-credential-libsecret"

# Unused on a single-user laptop: domain logins (sssd), printer discovery,
# modems, and the firmware-updater snap (it pops up dbx update prompts).
desktop_purge_packages:
  - sssd
  - sssd-common
  - libnss-sss
  - libpam-sss
  - sssd-ad
  - sssd-ad-common
  - sssd-ipa
  - sssd-krb5
  - sssd-krb5-common
  - sssd-ldap
  - sssd-proxy
desktop_disabled_services:
  - cups-browsed.service
  - ModemManager.service
desktop_remove_snaps:
  - firmware-updater

# Models (DMI product name, substring match) that need PCIe ASPM off to stop
# the Strix Halo GPU from freezing. See ~/notes/reference/gpu-freeze-grub-fix.md.
desktop_pcie_aspm_off_models:
  - HP ZBook Ultra G1a
