---
# Desktop role defaults: the i3/X11 desktop packages and the git-core PPA.

# Launchpad PPA for current git releases. files/git-core-ppa.asc is its
# signing key; this fingerprint (from
# https://launchpad.net/api/1.0/~git-core/+archive/ubuntu/ppa) is the one to
# check it against if the key ever needs replacing:
#   gpg --show-keys roles/desktop/files/git-core-ppa.asc
desktop_git_ppa_fingerprint: F911AB184317630C59970973E363C90F8F1B6217

desktop_packages:
  - i3
  - rofi
  - xcape
  - xdotool
  - xclip
  - xwallpaper
  - unclutter
  - maim
  - ffmpeg
  - imagemagick
  - acpi
  - jq
  - fzf
  - ripgrep
  - fd-find
  - plocate
  - sqlite3
  - libsqlite3-dev
  - git

# USB fingerprint sensors (vendor:product) that need the fprintd workarounds
# in tasks/main.yml: fprintd stopped before sleep (a scan that spans a suspend
# never recovers) and kept running otherwise (a scan that starts together
# with fprintd is lost).
desktop_fprint_sleep_sensors:
  - "06cb:0106"  # Synaptics, HP ZBook Ultra G1a (libfprint 1.95.1, Ubuntu 26.04)
