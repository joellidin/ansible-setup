---
# Tmux role - builds and installs tmux from source

- name: Check if tmux is installed
  ansible.builtin.command: tmux -V
  register: tmux_installed
  changed_when: false
  failed_when: false
  tags:
    - install
    - tmux
    - tmux-update
    - update

# A checkout cloned or built as root makes git refuse the directory
# ("dubious ownership") and the user-level build fail, so hand it back first.
- name: Find files in the tmux source tree not owned by the current user
  ansible.builtin.command:
    cmd: find {{ tmux_src_dir }} ! -user {{ ansible_user_id }} -print -quit
  register: tmux_foreign_files
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - install
    - tmux
    - tmux-update
    - update

- name: Take ownership of the tmux source tree
  become: true
  ansible.builtin.command:
    cmd: chown -R {{ ansible_user_id }}:{{ ansible_user_gid }} {{ tmux_src_dir }}
  when: tmux_foreign_files.stdout | default('') | length > 0
  changed_when: true
  tags:
    - install
    - tmux
    - tmux-update
    - update

- name: Clone or update tmux repository
  ansible.builtin.git:
    repo: "{{ tmux_repo }}"
    dest: "{{ tmux_src_dir }}"
    version: "{{ tmux_version }}"
    update: true
    force: false
  register: tmux_clone
  tags:
    - install
    - tmux
    - tmux-update
    - update

- name: Configure and build tmux
  ansible.builtin.shell: sh autogen.sh && ./configure && make
  args:
    chdir: "{{ tmux_src_dir }}"
  when: tmux_clone.changed or tmux_installed.rc != 0
  register: tmux_build
  changed_when: tmux_build.rc == 0
  tags:
    - install
    - tmux
    - tmux-update
    - update

- name: Install tmux
  become: true
  community.general.make:
    chdir: "{{ tmux_src_dir }}"
    target: install
  when: tmux_build.changed | default(false)
  tags:
    - install
    - tmux
    - tmux-update
    - update
