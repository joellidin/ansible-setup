---
# Go role defaults

# Go version to install. "latest" resolves the newest stable release from
# go.dev at run time; set an explicit version (e.g. "1.27.3") to pin it.
go_version: latest

# Architecture suffix used in go.dev tarball names
go_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"

# Installation path
go_install_path: /usr/local/go

# go.dev release feed. The stable-only feed is enough for "latest"; a pinned
# version needs include=all so older releases can be resolved too.
go_release_feed: "https://go.dev/dl/?mode=json{{ '' if go_version == 'latest' else '&include=all' }}"

# Where the tarball is downloaded before extraction
go_download_dir: "{{ cache_home | default(ansible_env.HOME ~ '/.cache') }}"

# Optional overrides. Normally both are taken from the go.dev feed, which
# publishes the sha256 of every tarball.
# go_download_url: https://go.dev/dl/go1.27.3.linux-amd64.tar.gz
# go_checksum: sha256:...
