---
# Kubectl role - installs kubectl from Kubernetes apt repository

- name: Ensure /etc/apt/keyrings exists
  become: true
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    - install
    - kubectl

- name: Check if Kubernetes GPG key exists
  ansible.builtin.stat:
    path: "{{ kubectl_keyring_path }}"
  register: kubectl_gpg_key
  tags:
    - install
    - kubectl

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubectl_version }}/deb/Release.key"
    dest: "{{ ansible_env.XDG_CACHE_HOME | default(ansible_env.HOME + '/.cache') }}/kubernetes.gpg.asc"
    mode: "0644"
  when: not kubectl_gpg_key.stat.exists
  tags:
    - install
    - kubectl

- name: Dearmor and install Kubernetes GPG key
  become: true
  ansible.builtin.shell: >
    gpg --dearmor
    < {{ ansible_env.XDG_CACHE_HOME | default(ansible_env.HOME + '/.cache') }}/kubernetes.gpg.asc
    > {{ kubectl_keyring_path }}
  args:
    creates: "{{ kubectl_keyring_path }}"
  when: not kubectl_gpg_key.stat.exists
  tags:
    - install
    - kubectl

- name: Set permissions on Kubernetes GPG key
  become: true
  ansible.builtin.file:
    path: "{{ kubectl_keyring_path }}"
    mode: "0644"
  when: not kubectl_gpg_key.stat.exists
  tags:
    - install
    - kubectl

- name: Add Kubernetes apt repository
  become: true
  ansible.builtin.apt_repository:
    repo: >-
      deb [signed-by={{ kubectl_keyring_path }}]
      https://pkgs.k8s.io/core:/stable:/{{ kubectl_version }}/deb/ /
    filename: kubernetes
    state: present
  tags:
    - install
    - kubectl

- name: Install kubectl
  become: true
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - kubectl
