---
# Python role defaults

# "latest" installs the newest stable CPython; set e.g. "3.14" to pin a minor.
python_version: latest

# uv binary location and installer
python_uv_bin: "{{ local_bin }}/uv"
python_uv_installer_url: https://astral.sh/uv/install.sh
python_uv_installer: "{{ cache_home }}/uv-install.sh"
