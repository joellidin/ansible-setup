---
# Build dependencies installation tasks

- name: Install build requirements for Neovim
  become: true
  ansible.builtin.apt:
    name: "{{ core_neovim_build_deps }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ core_apt_cache_valid_time }}"
  tags:
    - install
    - core
    - neovim

