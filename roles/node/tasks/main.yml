---
# Node role - installs Node.js via n version manager

- name: Install nodejs and npm from apt
  become: true
  ansible.builtin.apt:
    name:
      - nodejs
      - npm
    state: present
    cache_valid_time: 3600
  tags:
    - install
    - node

- name: Configure npm prefix
  ansible.builtin.command: npm config set prefix "{{ node_npm_prefix }}"
  changed_when: false
  tags:
    - install
    - node

- name: Configure npm cache
  ansible.builtin.command: npm config set cache "{{ node_npm_cache }}"
  changed_when: false
  tags:
    - install
    - node

- name: Install n version manager
  community.general.npm:
    name: n
    global: true
  tags:
    - install
    - node

- name: Check installed Node.js version
  ansible.builtin.command: "{{ node_n_prefix }}/bin/node --version"
  register: node_current_version
  changed_when: false
  failed_when: false
  tags:
    - install
    - node
    - node-update
    - update

- name: Install Node.js {{ node_version }} via n
  ansible.builtin.command: "{{ node_n_bin }} {{ node_version }}"
  environment:
    N_PREFIX: "{{ node_n_prefix }}"
  register: node_n_result
  changed_when: true
  when: node_current_version.rc != 0 or node_version not in node_current_version.stdout
  tags:
    - install
    - node
    - node-update
    - update

