---
# i3blocks role - builds and installs i3blocks from source

- name: Check if i3blocks is installed
  ansible.builtin.command: i3blocks -V
  register: i3blocks_installed
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - install
    - i3blocks
    - i3blocks-update
    - update

- name: Clone or update i3blocks repository
  ansible.builtin.git:
    repo: "{{ i3blocks_repo }}"
    dest: "{{ i3blocks_src_dir }}"
    version: "{{ i3blocks_version }}"
    update: true
    force: false
  register: i3blocks_clone
  until: i3blocks_clone is succeeded
  retries: 3
  delay: 10
  tags:
    - install
    - i3blocks
    - i3blocks-update
    - update

- name: Configure i3blocks
  ansible.builtin.shell: ./autogen.sh && ./configure
  args:
    chdir: "{{ i3blocks_src_dir }}"
  when: i3blocks_clone.changed or i3blocks_installed.rc != 0
  register: i3blocks_configure
  changed_when: i3blocks_configure.rc == 0
  tags:
    - install
    - i3blocks
    - i3blocks-update
    - update

- name: Build i3blocks
  community.general.make:
    chdir: "{{ i3blocks_src_dir }}"
  when: i3blocks_configure.changed | default(false)
  register: i3blocks_build
  tags:
    - install
    - i3blocks
    - i3blocks-update
    - update

- name: Install i3blocks
  become: true
  community.general.make:
    chdir: "{{ i3blocks_src_dir }}"
    target: install
  when: i3blocks_build.changed | default(false)
  tags:
    - install
    - i3blocks
    - i3blocks-update
    - update

# `make install` runs as root and may relink or touch files inside the
# checkout, which would make the ownership check above fire on every run.
- name: Restore ownership of the i3blocks source tree
  become: true
  ansible.builtin.command:
    cmd: chown -R {{ user_name }}:{{ user_gid }} {{ i3blocks_src_dir }}
  when: i3blocks_build.changed | default(false)
  changed_when: false
  tags:
    - install
    - i3blocks
    - i3blocks-update
    - update
