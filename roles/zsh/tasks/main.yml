---
# ZSH role - installs ZSH with Oh-My-Zsh and plugins

- name: Install ZSH
  become: true
  ansible.builtin.package:
    name: zsh
    state: present
  tags:
    - install
    - zsh

- name: Change shell to zsh
  become: true
  ansible.builtin.user:
    name: "{{ user_name }}"
    shell: /usr/bin/zsh
  tags:
    - install
    - zsh

- name: Check if Oh-My-Zsh exists
  ansible.builtin.stat:
    path: "{{ zsh_omz_path }}"
  register: zsh_omz_stat
  tags:
    - install
    - zsh

# A plain clone is what the upstream installer does with --unattended; unlike
# sh -c "$(curl ...)" it fails loudly when the download does, and it retries.
# Oh-My-Zsh updates itself, so an existing checkout is left alone.
- name: Install Oh-My-Zsh
  ansible.builtin.git:
    repo: https://github.com/ohmyzsh/ohmyzsh.git
    dest: "{{ zsh_omz_path }}"
    version: master
    depth: 1
    update: false
  when: not zsh_omz_stat.stat.exists
  register: zsh_omz_clone
  until: zsh_omz_clone is succeeded
  retries: 3
  delay: 10
  tags:
    - install
    - zsh

- name: Remove default .zshrc created by Oh-My-Zsh
  ansible.builtin.file:
    path: "{{ home_dir }}/.zshrc"
    state: absent
  tags:
    - install
    - zsh

- name: Install zsh-autosuggestions
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-autosuggestions.git
    dest: "{{ zsh_omz_path }}/custom/plugins/zsh-autosuggestions"
    version: master
    update: true
  register: zsh_autosuggestions_clone
  until: zsh_autosuggestions_clone is succeeded
  retries: 3
  delay: 10
  tags:
    - install
    - zsh

- name: Install zsh-fzf-history-search
  ansible.builtin.git:
    repo: https://github.com/joshskidmore/zsh-fzf-history-search.git
    dest: "{{ zsh_omz_path }}/custom/plugins/zsh-fzf-history-search"
    version: master
    update: true
  register: zsh_fzf_history_search_clone
  until: zsh_fzf_history_search_clone is succeeded
  retries: 3
  delay: 10
  tags:
    - install
    - zsh

- name: Install zsh-syntax-highlighting
  ansible.builtin.git:
    repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
    dest: "{{ zsh_omz_path }}/custom/plugins/zsh-syntax-highlighting"
    version: master
    update: true
  register: zsh_syntax_highlighting_clone
  until: zsh_syntax_highlighting_clone is succeeded
  retries: 3
  delay: 10
  tags:
    - install
    - zsh

- name: Check if Starship is installed
  ansible.builtin.command: "{{ zsh_starship_bin_dir }}/starship --version"
  register: zsh_starship_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags:
    - install
    - zsh
    - starship

- name: Ensure Starship bin directory exists
  ansible.builtin.file:
    path: "{{ zsh_starship_bin_dir }}"
    state: directory
    mode: "0755"
  when: zsh_starship_check.rc != 0
  tags:
    - install
    - zsh
    - starship

- name: Download Starship installer
  ansible.builtin.get_url:
    timeout: 60
    url: https://starship.rs/install.sh
    dest: "{{ zsh_starship_installer }}"
    mode: "0755"
  when: zsh_starship_check.rc != 0
  register: zsh_starship_download
  until: zsh_starship_download is succeeded
  retries: 3
  delay: 5
  tags:
    - install
    - zsh
    - starship

- name: Install Starship
  ansible.builtin.command: "{{ zsh_starship_installer }} -y -b {{ zsh_starship_bin_dir }}"
  when: zsh_starship_check.rc != 0
  changed_when: true
  register: zsh_starship_install
  until: zsh_starship_install.rc == 0
  retries: 3
  delay: 10
  tags:
    - install
    - zsh
    - starship

- name: Create ZSH state directory
  ansible.builtin.file:
    path: "{{ zsh_state_dir }}"
    state: directory
    mode: "0755"
  tags:
    - install
    - zsh

- name: Create ZSH history file
  ansible.builtin.file:
    path: "{{ zsh_state_dir }}/history"
    state: touch
    mode: "0600"
    modification_time: preserve
    access_time: preserve
  tags:
    - install
    - zsh
