---
# ZSH role defaults

# Oh-My-Zsh installation path
zsh_omz_path: "{{ home_dir }}/.local/src/oh-my-zsh"

# ZSH state directory for history
zsh_state_dir: "{{ home_dir }}/.local/state/zsh"

# Starship installer path (avoid /tmp noexec issues)
zsh_starship_installer: >-
  {{ cache_home }}/starship-install.sh

# Starship binary directory
zsh_starship_bin_dir: "{{ home_dir }}/.local/bin"
