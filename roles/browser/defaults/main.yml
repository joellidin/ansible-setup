---
# Browser role defaults

# Browser choice: brave, zen, none
browser_choice: "zen"

# Brave browser settings
browser_brave_gpg_url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
browser_brave_repo_url: https://brave-browser-apt-release.s3.brave.com/
# Written by the old apt_repository task; removed so apt does not see the
# repository twice.
browser_brave_legacy_sources:
  - /etc/apt/sources.list.d/brave-browser-release.list
  - /usr/share/keyrings/brave-browser-archive-keyring.gpg

# Zen browser settings. "latest" follows the newest GitHub release; set a tag
# such as "1.24.1b" to pin. The sha256 comes from the release asset digest.
browser_zen_version: latest
browser_zen_github_repo: zen-browser/desktop
browser_zen_asset: "zen.linux-{{ 'x86_64' if cpu_arch == 'x86_64' else 'aarch64' }}.tar.xz"
browser_zen_install_dir: "{{ local_share }}/zen-browser"
browser_zen_download_dir: "{{ cache_home }}"
