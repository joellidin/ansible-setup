# Zen browser settings
browser_zen_version: "1.17.15b"
browser_zen_install_dir: "{{ local_share }}/zen-browser"
browser_zen_download_url: >-
  https://github.com/zen-browser/desktop/releases/download/{{
  browser_zen_version }}/zen.linux-x86_64.tar.xz
browser_zen_checksum: "13ef9d59e25c61b0af9b182f89ad1a5b08eb197d9e61668f145d752dda378778"
