---
# Browser role - installs web browsers

- name: Install Brave browser
  ansible.builtin.include_tasks: brave.yml
  when: browser_choice == "brave"
  tags:
    - install
    - browser
    - brave

- name: Install Zen browser
  ansible.builtin.include_tasks: zen.yml
  when: browser_choice == "zen"
  tags:
    - install
    - browser
    - zen
    - zen-update
    - update
