---
# Brave browser installation

- name: Remove legacy Brave apt source files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ browser_brave_legacy_sources }}"

- name: Add Brave apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: brave-browser-release
    types: deb
    uris: "{{ browser_brave_repo_url }}"
    suites: stable
    components: main
    architectures: "{{ deb_arch }}"
    signed_by: "{{ browser_brave_gpg_url }}"
    state: present
  register: browser_brave_repo

- name: Refresh apt cache after adding the Brave repository
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: browser_brave_repo.changed

- name: Install Brave browser
  become: true
  ansible.builtin.apt:
    name: brave-browser
    state: present
    update_cache: true
    cache_valid_time: 3600
