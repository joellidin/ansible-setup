---
# Docker installation role

- name: Remove legacy Docker apt source files
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ docker_legacy_sources }}"

- name: Add Docker apt repository
  become: true
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: "{{ docker_repo_url }}"
    suites: "{{ distro_release }}"
    components: stable
    architectures: "{{ deb_arch }}"
    signed_by: "{{ docker_gpg_url }}"
    state: present
  register: docker_repo

- name: Refresh apt cache after adding the Docker repository
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: docker_repo.changed

- name: Install Docker packages
  become: true
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure docker group exists
  become: true
  ansible.builtin.group:
    name: docker
    state: present

- name: Check if user is in docker group
  ansible.builtin.command: groups {{ user_name }}
  register: docker_user_groups
  changed_when: false
  check_mode: false

- name: Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ user_name }}"
    groups: docker
    append: true
  when: "'docker' not in docker_user_groups.stdout"
  notify: Docker group changed

- name: Ensure Docker service is started and enabled
  become: true
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
