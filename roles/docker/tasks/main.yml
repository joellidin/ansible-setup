---
# Docker installation role

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true

- name: Check if Docker GPG key exists
  ansible.builtin.stat:
    path: "{{ docker_gpg_keyring }}"
  register: docker_gpg_key

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: "{{ docker_gpg_url }}"
    dest: /tmp/docker.gpg.asc
    mode: '0644'
  when: not docker_gpg_key.stat.exists

- name: Dearmor and install Docker GPG key
  ansible.builtin.shell: |
    gpg --dearmor < /tmp/docker.gpg.asc > {{ docker_gpg_keyring }}
  args:
    creates: "{{ docker_gpg_keyring }}"
  become: true
  when: not docker_gpg_key.stat.exists

- name: Set permissions on Docker GPG key
  ansible.builtin.file:
    path: "{{ docker_gpg_keyring }}"
    mode: '0644'
  become: true

- name: Get system architecture
  ansible.builtin.command: dpkg --print-architecture
  register: dpkg_arch
  changed_when: false

- name: Get Ubuntu codename
  ansible.builtin.command: lsb_release -cs
  register: ubuntu_codename
  changed_when: false

- name: Add Docker repository
  vars:
    arch: "{{ dpkg_arch.stdout }}"
    codename: "{{ ubuntu_codename.stdout }}"
  ansible.builtin.apt_repository:
    repo: "deb [arch={{ arch }} signed-by={{ docker_gpg_keyring }}] {{ docker_repo_url }} {{ codename }} stable"
    filename: docker
    state: present
  become: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
  become: true

- name: Ensure docker group exists
  ansible.builtin.group:
    name: docker
    state: present
  become: true

- name: Check if user is in docker group
  ansible.builtin.command: groups {{ ansible_user_id }}
  register: user_groups
  changed_when: false

- name: Add user to docker group
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    groups: docker
    append: true
  become: true
  when: "'docker' not in user_groups.stdout"
  notify: Docker group changed

- name: Ensure Docker service is started and enabled
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true
  become: true
