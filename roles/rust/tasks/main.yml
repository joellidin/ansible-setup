---
# Rust role - installs Rust toolchain via rustup

- name: Check if cargo is installed
  ansible.builtin.command: which cargo
  environment:
    PATH: "{{ rust_cargo_home }}/bin:{{ ansible_env.PATH }}"
  register: rust_cargo_check
  changed_when: false
  failed_when: false
  tags:
    - install
    - rust

- name: Create cache directory for rustup installer
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.cache"
    state: directory
    mode: "0755"
  when: rust_cargo_check.rc != 0
  tags:
    - install
    - rust

- name: Download rustup installer
  ansible.builtin.get_url:
    url: https://sh.rustup.rs
    dest: "{{ ansible_env.HOME }}/.cache/rustup-init.sh"
    mode: "0755"
    force: true
  when: rust_cargo_check.rc != 0
  tags:
    - install
    - rust

- name: Install Rust via rustup
  ansible.builtin.command: "{{ ansible_env.HOME }}/.cache/rustup-init.sh -y"
  environment:
    CARGO_HOME: "{{ rust_cargo_home }}"
    RUSTUP_HOME: "{{ rust_rustup_home }}"
    TMPDIR: "{{ ansible_env.HOME }}/.cache"
  when: rust_cargo_check.rc != 0
  changed_when: true
  tags:
    - install
    - rust

- name: Set default toolchain
  ansible.builtin.command: rustup default {{ rust_toolchain }}
  environment:
    CARGO_HOME: "{{ rust_cargo_home }}"
    RUSTUP_HOME: "{{ rust_rustup_home }}"
    PATH: "{{ rust_cargo_home }}/bin:{{ ansible_env.PATH }}"
  register: rust_toolchain_result
  changed_when: "'unchanged' not in rust_toolchain_result.stdout"
  tags:
    - install
    - rust
    - rust-update
    - update

- name: Update Rust toolchains
  ansible.builtin.command: rustup update
  environment:
    CARGO_HOME: "{{ rust_cargo_home }}"
    RUSTUP_HOME: "{{ rust_rustup_home }}"
    PATH: "{{ rust_cargo_home }}/bin:{{ ansible_env.PATH }}"
  register: rust_update_result
  changed_when: "'Updated' in rust_update_result.stdout"
  tags:
    - rust-update
    - update

- name: Clean up rustup installer
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.cache/rustup-init.sh"
    state: absent
  tags:
    - install
    - rust
