---
# Neovim role defaults

# Repository and version
neovim_repo: https://github.com/neovim/neovim.git
neovim_version: stable

# Installation paths
neovim_src_dir: "{{ home_dir }}/.local/src/neovim"
neovim_data_path: "{{ home_dir }}/.local/share/nvim"

# Cargo paths for stylua
neovim_cargo_home: "{{ home_dir }}/.local/share/cargo"

# Build type (Release, RelWithDebInfo, Debug)
neovim_build_type: RelWithDebInfo
