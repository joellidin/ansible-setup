---
# Gopass role - zsh completion and password store for the mise-installed gopass

- name: Verify gopass is available
  ansible.builtin.command: "{{ gopass_bin }} --version"
  changed_when: false
  check_mode: false
  tags:
    - install
    - gopass

- name: Create gopass directory in Oh-My-Zsh
  ansible.builtin.file:
    path: "{{ gopass_omz_path }}/plugins/gopass"
    state: directory
    mode: "0755"
  tags:
    - install
    - gopass

- name: Check if gopass completion exists
  ansible.builtin.stat:
    path: "{{ gopass_omz_path }}/plugins/gopass/_gopass"
  register: gopass_completion_stat
  tags:
    - install
    - gopass

- name: Generate gopass completion
  ansible.builtin.shell: >
    {{ gopass_bin }} completion zsh
    > {{ gopass_omz_path }}/plugins/gopass/_gopass
  when: not gopass_completion_stat.stat.exists
  changed_when: true
  tags:
    - install
    - gopass

# The store is a private repository. On a machine without GitHub credentials
# (gh auth login, or the YubiKey SSH key) the clone is skipped with a note
# instead of failing the whole run.
- name: Check access to the password store repository
  ansible.builtin.command: git ls-remote --exit-code {{ gopass_store_repo }} HEAD
  register: gopass_store_access
  changed_when: false
  failed_when: false
  check_mode: false
  when: gopass_store_repo | length > 0
  tags:
    - install
    - gopass

- name: Explain how to get the password store later
  ansible.builtin.debug:
    msg: >-
      Cannot reach {{ gopass_store_repo }} with the current credentials.
      Run `gh auth login` (or plug in the YubiKey) and re-run `--tags gopass`.
  when: gopass_store_repo | length > 0 and gopass_store_access.rc != 0
  tags:
    - install
    - gopass

- name: Create gopass store directory
  ansible.builtin.file:
    path: "{{ gopass_store_path }}"
    state: directory
    mode: "0700"
  when: gopass_store_repo | length > 0 and gopass_store_access.rc == 0
  tags:
    - install
    - gopass

- name: Clone password store repository
  ansible.builtin.git:
    repo: "{{ gopass_store_repo }}"
    dest: "{{ gopass_store_path }}"
    version: HEAD
    update: true
  when: gopass_store_repo | length > 0 and gopass_store_access.rc == 0
  register: gopass_store_clone
  until: gopass_store_clone is succeeded
  retries: 3
  delay: 10
  tags:
    - install
    - gopass
