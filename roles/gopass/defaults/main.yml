---
# Gopass role defaults. The gopass binary is installed by mise; this role
# generates the zsh completion and clones the password store.

gopass_bin: "{{ mise_shims_dir | default(local_share ~ '/mise/shims') }}/gopass"
gopass_omz_path: "{{ oh_my_zsh_path | default(local_src ~ '/oh-my-zsh') }}"
gopass_store_path: "{{ local_share }}/gopass/stores/root"

# Password store repository (optional)
gopass_store_repo: ""
