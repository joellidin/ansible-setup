---
# Regolith role - sets up Regolith Linux desktop environment repository

- name: Download Regolith GPG key
  become: true
  ansible.builtin.shell: |
    set -o pipefail
    wget -qO - {{ regolith_key_url }} | \
    gpg --dearmor > /tmp/regolith-key.gpg
  args:
    executable: /bin/bash
  register: regolith_key_download
  changed_when: true
  tags:
    - install
    - regolith

- name: Install Regolith GPG key if changed
  become: true
  ansible.builtin.copy:
    src: /tmp/regolith-key.gpg
    dest: "{{ regolith_keyring_path }}"
    mode: '0644'
    remote_src: true
  tags:
    - install
    - regolith

- name: Add Regolith repository
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/regolith.list
    content: |
      deb [arch=amd64 signed-by={{ regolith_keyring_path }}] {{ regolith_repo_url }} {{ regolith_ubuntu_codename }} main
    mode: '0644'
  tags:
    - install
    - regolith
