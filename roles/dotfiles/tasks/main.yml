---
# Dotfiles role - manages dotfiles via bare git repository

- name: Clone dotfiles repository
  ansible.builtin.git:
    repo: "{{ dotfiles_repo }}"
    dest: "{{ dotfiles_dir }}"
    bare: true
    update: true
    accept_hostkey: true
    version: "{{ dotfiles_version }}"
  register: dotfiles_clone
  until: dotfiles_clone is succeeded
  retries: 3
  delay: 10
  tags:
    - install
    - dotfiles

- name: Check if dotfiles already installed
  ansible.builtin.stat:
    path: "{{ dotfiles_home }}/.config/zsh/.zshrc"
  register: dotfiles_zshrc
  tags:
    - install
    - dotfiles

- name: Create backup directory for configs
  ansible.builtin.file:
    path: "{{ dotfiles_backup_dir }}"
    state: directory
    mode: '0755'
  when: not dotfiles_zshrc.stat.exists
  tags:
    - install
    - dotfiles

# Every tracked file that already exists in the home moves into the backup,
# keeping its path relative to the home so same-named files do not collide.
- name: Backup existing configs
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      /usr/bin/git --git-dir={{ dotfiles_dir | quote }} ls-tree -r -z --name-only HEAD |
      while IFS= read -r -d '' f; do
        if [ -e {{ dotfiles_home | quote }}/"$f" ] || [ -L {{ dotfiles_home | quote }}/"$f" ]; then
          mkdir -p "$(dirname {{ dotfiles_backup_dir | quote }}/"$f")"
          mv {{ dotfiles_home | quote }}/"$f" {{ dotfiles_backup_dir | quote }}/"$f"
          echo "$f"
        fi
      done
  register: dotfiles_backup_moved
  changed_when: dotfiles_backup_moved.stdout | length > 0
  when: not dotfiles_zshrc.stat.exists
  tags:
    - install
    - dotfiles

# The dotfiles are zsh only, so a new home keeps no bash startup files. The
# skeleton copies join the backup, with whatever the checkout displaced.
- name: Move the bash startup files into the backup
  ansible.builtin.command:
    cmd: mv {{ dotfiles_home }}/{{ item }} {{ dotfiles_backup_dir }}/{{ item }}
    removes: "{{ dotfiles_home }}/{{ item }}"
  loop: "{{ dotfiles_bash_files }}"
  when: not dotfiles_zshrc.stat.exists
  tags:
    - install
    - dotfiles

- name: Check if backup directory is empty
  ansible.builtin.find:
    paths: "{{ dotfiles_backup_dir }}"
    file_type: any
    hidden: true
  register: dotfiles_backup_files
  when: not dotfiles_zshrc.stat.exists
  tags:
    - install
    - dotfiles

- name: Remove backup directory if empty
  ansible.builtin.file:
    path: "{{ dotfiles_backup_dir }}"
    state: absent
  when:
    - not dotfiles_zshrc.stat.exists
    - dotfiles_backup_files.matched == 0
  tags:
    - install
    - dotfiles

- name: Install dotfiles configs
  ansible.builtin.shell: >
    /usr/bin/git --git-dir={{ dotfiles_dir }}/ --work-tree={{ dotfiles_home }} checkout
  register: dotfiles_checkout
  changed_when: dotfiles_checkout.rc == 0
  when: not dotfiles_zshrc.stat.exists
  tags:
    - install
    - dotfiles

- name: Hide untracked files
  ansible.builtin.shell: |
    /usr/bin/git --git-dir={{ dotfiles_dir }}/ --work-tree={{ dotfiles_home }} \
      config --local status.showUntrackedFiles no
  changed_when: false
  tags:
    - install
    - dotfiles
