---
# Dotfiles role default variables

# Git repository URL for dotfiles
dotfiles_repo: "https://github.com/joellidin/dotfiles.git"

# Branch to checkout
dotfiles_version: "main"

# Destination directory for bare git repo
dotfiles_dir: "{{ ansible_env.HOME }}/.dotfiles"

# Home directory (worktree)
dotfiles_home: "{{ ansible_env.HOME }}"

# Backup directory for existing configs
dotfiles_backup_dir: "{{ ansible_env.HOME }}/.config-backup"
