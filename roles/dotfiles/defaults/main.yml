---
# Dotfiles role default variables

# Git repository URL for dotfiles
dotfiles_repo: "https://github.com/joellidin/dotfiles.git"

# Branch to checkout
dotfiles_version: "main"

# Destination directory for bare git repo
dotfiles_dir: "{{ home_dir }}/.dotfiles"

# Home directory (worktree)
dotfiles_home: "{{ home_dir }}"

# Backup directory for existing configs
dotfiles_backup_dir: "{{ home_dir }}/.config-backup"

# Bash startup files from /etc/skel, moved into the backup on the first
# checkout because the dotfiles are zsh only
dotfiles_bash_files:
  - .bashrc
  - .bash_logout
