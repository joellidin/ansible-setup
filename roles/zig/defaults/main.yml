---
# Zig role defaults

# Zig version to install
zig_version: "0.15.2"

# Installation path
zig_install_dir: "{{ local_share }}/zig"
zig_bin: "{{ zig_install_dir }}/zig"

# Download URL
zig_download_url: >-
  https://ziglang.org/download/{{ zig_version
  }}/zig-x86_64-linux-{{ zig_version }}.tar.xz
