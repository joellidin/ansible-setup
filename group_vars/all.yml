---
# =============================================================================
# Centralized Configuration for Ansible Bootstrap Playbook
# =============================================================================
# All versions and paths are defined here for easy maintenance.
# Update versions in this single file rather than across multiple task files.

# -----------------------------------------------------------------------------
# Facts
# -----------------------------------------------------------------------------
# Facts are read through ansible_facts[] (inject_facts_as_vars is off).

# The play-level environment block is rendered before facts exist, so HOME
# falls back to the controller's environment (the play runs locally anyway).
home_dir: "{{ (ansible_facts['env'] | default({}))['HOME'] | default(lookup('env', 'HOME')) }}"
user_name: "{{ ansible_facts['user_id'] }}"
user_gid: "{{ ansible_facts['user_gid'] }}"
cpu_arch: "{{ ansible_facts['architecture'] }}"
deb_arch: "{{ 'amd64' if cpu_arch == 'x86_64' else 'arm64' }}"
distro_release: "{{ ansible_facts['distribution_release'] }}"
distro_version: "{{ ansible_facts['distribution_version'] }}"

# -----------------------------------------------------------------------------
# Tool Versions
# -----------------------------------------------------------------------------
# GitHub-release tools (go, node, zig, delta, gh, kubectl, vault, gopass)
# are versioned by mise in ~/.config/mise/config.toml and mise.lock.
# herdr and Claude Code install once and then update themselves.
# Source builds track their repositories (see Git Repositories below).

# -----------------------------------------------------------------------------
# XDG Base Directory Paths
# -----------------------------------------------------------------------------
# Following XDG Base Directory Specification for clean home directory.
# Reference: https://specifications.freedesktop.org/basedir-spec/basedir-spec-latest.html

local_bin: "{{ home_dir }}/.local/bin"
local_src: "{{ home_dir }}/.local/src"
local_share: "{{ home_dir }}/.local/share"
local_state: "{{ home_dir }}/.local/state"
config_home: "{{ home_dir }}/.config"
cache_home: "{{ home_dir }}/.cache"

# -----------------------------------------------------------------------------
# Language-Specific Paths
# -----------------------------------------------------------------------------

# Rust
cargo_home: "{{ local_share }}/cargo"
rustup_home: "{{ local_share }}/rustup"

# mise (tool versions)
mise_data_dir: "{{ local_share }}/mise"
mise_shims_dir: "{{ mise_data_dir }}/shims"

# -----------------------------------------------------------------------------
# Application Paths
# -----------------------------------------------------------------------------

oh_my_zsh_path: "{{ local_src }}/oh-my-zsh"
dotfiles_path: "{{ home_dir }}/.dotfiles"
nvim_data_path: "{{ local_share }}/nvim"
gopass_store_path: "{{ local_share }}/gopass/stores/root"

# -----------------------------------------------------------------------------
# Git Repositories
# -----------------------------------------------------------------------------

dotfiles_repo: "https://github.com/joellidin/dotfiles.git"
neovim_repo: "https://github.com/neovim/neovim.git"
neovim_version: master  # 0.13 dev; use "stable" for releases or "nightly" for daily snapshots
tmux_repo: "https://github.com/tmux/tmux.git"
i3blocks_repo: "https://github.com/vivien/i3blocks"
gopass_store_repo: "https://github.com/joellidin/private-pass.git"

# -----------------------------------------------------------------------------
# GitHub API
# -----------------------------------------------------------------------------
# Release lookups go through api.github.com. Unauthenticated calls are rate
# limited per IP (CI runners hit this); when GITHUB_TOKEN is set in the
# environment it is sent along. mise reads the same variable itself.

github_token: "{{ lookup('env', 'GITHUB_TOKEN') | default('', true) }}"
github_api_headers: "{{ {'Authorization': 'Bearer ' ~ github_token} if github_token | length > 0 else {} }}"

# -----------------------------------------------------------------------------
# Application Choices
# -----------------------------------------------------------------------------
# Configure which applications to install when alternatives exist.

# Browser: brave, zen, none
browser_choice: "zen"

# -----------------------------------------------------------------------------
# Update Behavior
# -----------------------------------------------------------------------------
# Control how updates are handled across roles.

# Force rebuild even if version matches (useful for rebuilding from source)
force_rebuild: false
