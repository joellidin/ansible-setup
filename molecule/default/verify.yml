---
- name: Verify
  hosts: all
  gather_facts: true

  vars:
    home_dir: "{{ ansible_facts['env']['HOME'] }}"
    user_name: "{{ ansible_facts['user_id'] }}"

  tasks:
    # Verify ZSH installation
    - name: Check zsh is installed
      ansible.builtin.command: which zsh
      register: zsh_check
      changed_when: false

    - name: Verify zsh installation
      ansible.builtin.assert:
        that:
          - zsh_check.rc == 0
        fail_msg: "ZSH is not installed"
        success_msg: "ZSH is installed at {{ zsh_check.stdout }}"

    - name: Check user shell is zsh
      ansible.builtin.command: getent passwd {{ user_name }}
      register: user_shell
      changed_when: false

    - name: Verify user shell
      ansible.builtin.assert:
        that:
          - "'/bin/zsh' in user_shell.stdout or '/usr/bin/zsh' in user_shell.stdout"
        fail_msg: "User shell is not ZSH"
        success_msg: "User shell is correctly set to ZSH"

    # Verify oh-my-zsh
    - name: Check oh-my-zsh directory exists
      ansible.builtin.stat:
        path: "{{ home_dir }}/.local/src/oh-my-zsh"
      register: omz_dir

    - name: Verify oh-my-zsh installation
      ansible.builtin.assert:
        that:
          - omz_dir.stat.exists
          - omz_dir.stat.isdir
        fail_msg: "Oh-My-Zsh is not installed"
        success_msg: "Oh-My-Zsh is installed"

    # Verify Docker
    - name: Check docker is installed
      ansible.builtin.command: which docker
      register: docker_check
      changed_when: false
      failed_when: false

    - name: Verify docker installation
      ansible.builtin.assert:
        that:
          - docker_check.rc == 0
        fail_msg: "Docker is not installed"
        success_msg: "Docker is installed at {{ docker_check.stdout }}"

    - name: Check user is in docker group
      ansible.builtin.command: groups {{ user_name }}
      register: user_groups
      changed_when: false

    - name: Verify docker group membership
      ansible.builtin.assert:
        that:
          - "'docker' in user_groups.stdout"
        fail_msg: "User is not in docker group"
        success_msg: "User is in docker group"

    # Verify mise-managed tools
    - name: Check mise-managed tools resolve through the shims
      ansible.builtin.command: "{{ home_dir }}/.local/share/mise/shims/{{ item.name }} {{ item.args }}"
      loop:
        - { name: go, args: version }
        - { name: node, args: --version }
        - { name: delta, args: --version }
        - { name: gh, args: --version }
        - { name: kubectl, args: version --client }
        - { name: vault, args: --version }
        - { name: gopass, args: --version }
      loop_control:
        label: "{{ item.name }}"
      register: mise_tool_check
      changed_when: false
      failed_when: false

    - name: Verify mise-managed tools
      ansible.builtin.assert:
        that:
          - mise_tool_check.results | rejectattr('rc', 'equalto', 0) | list | length == 0
        fail_msg: >-
          Missing mise tools: {{ mise_tool_check.results
          | rejectattr('rc', 'equalto', 0) | map(attribute='item.name') | list }}
        success_msg: "All mise-managed tools are installed"

    # Verify Zen browser
    - name: Check zen browser is installed
      ansible.builtin.stat:
        path: "{{ home_dir }}/.local/bin/zen"
      register: zen_check

    - name: Verify zen installation
      ansible.builtin.assert:
        that:
          - zen_check.stat.exists
        fail_msg: "Zen browser is not installed"
        success_msg: "Zen browser is installed"

    # Verify APT repositories are configured
    - name: Check Docker repository exists
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/docker.sources
      register: docker_repo

    - name: Verify Docker repository
      ansible.builtin.assert:
        that:
          - docker_repo.stat.exists
        fail_msg: "Docker APT repository not configured"
        success_msg: "Docker APT repository is configured"

    # Verify the desktop role masks GNOME's SSH agent
    - name: Check the GNOME SSH agent masks
      ansible.builtin.stat:
        path: "{{ home_dir }}/.config/systemd/user/{{ item }}"
      loop:
        - gcr-ssh-agent.socket
        - gcr-ssh-agent.service
      register: gcr_masks

    - name: Verify the GNOME SSH agent masks
      ansible.builtin.assert:
        that:
          - item.stat.islnk | default(false)
          - item.stat.lnk_source | default('') == '/dev/null'
        fail_msg: "{{ item.item }} is not masked (no link to /dev/null)"
        success_msg: "{{ item.item }} is masked"
      loop: "{{ gcr_masks.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Check notify-send is installed
      ansible.builtin.command: which notify-send
      register: notify_send_check
      changed_when: false
      failed_when: false

    - name: Verify notify-send installation
      ansible.builtin.assert:
        that:
          - notify_send_check.rc == 0
        fail_msg: "notify-send (libnotify-bin) is not installed"
        success_msg: "notify-send is installed"

    # fc-match always answers with some font, so compare the family it picks.
    - name: Check the fonts the menus and bars use
      ansible.builtin.command: fc-match -f '%{family[0]}' '{{ item }}'
      loop:
        - JetBrainsMono Nerd Font
        - Symbols Nerd Font
        - Symbols Nerd Font Mono
      register: font_check
      changed_when: false

    - name: Verify the fonts the menus and bars use
      ansible.builtin.assert:
        that:
          - item.stdout == item.item
        fail_msg: "{{ item.item }} resolves to {{ item.stdout }}"
        success_msg: "{{ item.item }} is installed"
      loop: "{{ font_check.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Summary
    - name: Summarise mise tool results
      ansible.builtin.set_fact:
        mise_tools_ok: "{{ mise_tool_check.results | rejectattr('rc', 'equalto', 0) | list | length == 0 }}"

    - name: Display verification summary
      ansible.builtin.debug:
        msg: |
          Verification complete!
          - ZSH: {{ 'OK' if zsh_check.rc == 0 else 'FAILED' }}
          - Oh-My-Zsh: {{ 'OK' if omz_dir.stat.exists else 'FAILED' }}
          - Docker: {{ 'OK' if docker_check.rc == 0 else 'FAILED' }}
          - mise tools: {{ 'OK' if mise_tools_ok else 'FAILED' }}
          - Zen: {{ 'OK' if zen_check.stat.exists else 'FAILED' }}
