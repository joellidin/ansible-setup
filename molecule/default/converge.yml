---
- name: Converge
  hosts: all
  become: false
  gather_facts: true

  vars:
    # Project root for relative imports
    project_root: "{{ playbook_dir }}/../.."

    # Override paths for test environment
    local_bin: "{{ ansible_env.HOME }}/.local/bin"
    local_src: "{{ ansible_env.HOME }}/.local/src"
    local_share: "{{ ansible_env.HOME }}/.local/share"
    local_state: "{{ ansible_env.HOME }}/.local/state"
    config_home: "{{ ansible_env.HOME }}/.config"
    cache_home: "{{ ansible_env.HOME }}/.cache"

    # Skip certain tasks in CI that require external resources
    skip_encrypted_files: true

    # Override role defaults for molecule paths
    core_fonts_source_dir: "{{ project_root }}/fonts"

  environment:
    CARGO_HOME: "{{ ansible_env.HOME }}/.local/share/cargo"
    RUSTUP_HOME: "{{ ansible_env.HOME }}/.local/share/rustup"
    N_PREFIX: "{{ ansible_env.HOME }}/.local/share/n"
    NPM_CONFIG_USERCONFIG: "{{ ansible_env.HOME }}/.config/npm/npmrc"

  pre_tasks:
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ local_bin }}"
        - "{{ local_src }}"
        - "{{ local_share }}"
        - "{{ local_state }}"
        - "{{ config_home }}"
        - "{{ cache_home }}"

    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  tasks:
    # Test core setup and productivity tools
    - name: Include productivity tools
      ansible.builtin.import_tasks: ../../tasks/productivity-tools.yml
      tags:
        - productivity

    - name: Include core role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/core"
      tags:
        - core

    - name: Include dotfiles role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/dotfiles"
      tags:
        - dotfiles

    - name: Include gpg role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/gpg"
      when: not skip_encrypted_files
      tags:
        - gpg

    - name: Include regolith role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/regolith"
      tags:
        - regolith

    # Test docker role
    - name: Include docker role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/docker"
      tags:
        - docker

    # Test desktop and browser roles
    - name: Include zsh role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/zsh"
      tags:
        - zsh

    - name: Include kubectl role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/kubectl"
      tags:
        - kubectl

    - name: Include vault role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/vault"
      tags:
        - vault

    - name: Include gopass role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/gopass"
      vars:
        gopass_store_repo: ""
      tags:
        - gopass

    - name: Include browser role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/browser"
      tags:
        - browser

    # Test language roles
    - name: Include rust role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/rust"
      tags:
        - rust

    - name: Include python role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/python"
      tags:
        - python

    - name: Include go role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/go"
      tags:
        - go

    - name: Include node role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/node"
      tags:
        - node

    # Test dev tool roles
    - name: Include neovim role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/neovim"
      tags:
        - neovim

    - name: Include tmux role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/tmux"
      tags:
        - tmux

    - name: Include gh role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/gh"
      when: not skip_encrypted_files
      tags:
        - gh

    - name: Include i3blocks role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/i3blocks"
      tags:
        - i3blocks
