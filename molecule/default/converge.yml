---
- name: Converge
  hosts: all
  become: false
  gather_facts: true

  vars:
    # Project root for relative imports
    project_root: "{{ playbook_dir }}/../.."

    # The repo's group_vars are not on molecule's inventory path, so the
    # shared variables are repeated here.
    # The play-level environment block is rendered before facts exist, so HOME
    # falls back to the controller's environment.
    home_dir: "{{ (ansible_facts['env'] | default({}))['HOME'] | default(lookup('env', 'HOME')) }}"
    user_name: "{{ ansible_facts['user_id'] }}"
    user_gid: "{{ ansible_facts['user_gid'] }}"
    cpu_arch: "{{ ansible_facts['architecture'] }}"
    deb_arch: "{{ 'amd64' if cpu_arch == 'x86_64' else 'arm64' }}"
    distro_release: "{{ ansible_facts['distribution_release'] }}"
    distro_version: "{{ ansible_facts['distribution_version'] }}"
    local_bin: "{{ home_dir }}/.local/bin"
    local_src: "{{ home_dir }}/.local/src"
    local_share: "{{ home_dir }}/.local/share"
    local_state: "{{ home_dir }}/.local/state"
    config_home: "{{ home_dir }}/.config"
    cache_home: "{{ home_dir }}/.cache"
    cargo_home: "{{ local_share }}/cargo"
    rustup_home: "{{ local_share }}/rustup"
    mise_data_dir: "{{ local_share }}/mise"
    mise_shims_dir: "{{ mise_data_dir }}/shims"
    oh_my_zsh_path: "{{ local_src }}/oh-my-zsh"
    dotfiles_path: "{{ home_dir }}/.dotfiles"
    dotfiles_repo: "https://github.com/joellidin/dotfiles.git"
    neovim_repo: "https://github.com/neovim/neovim.git"
    neovim_version: master
    tmux_repo: "https://github.com/tmux/tmux.git"
    i3blocks_repo: "https://github.com/vivien/i3blocks"
    browser_choice: "zen"
    force_rebuild: false
    gopass_store_repo: ""
    github_token: "{{ lookup('env', 'GITHUB_TOKEN') | default('', true) }}"
    github_api_headers: "{{ {'Authorization': 'Bearer ' ~ github_token} if github_token | length > 0 else {} }}"

    # Override role defaults for molecule paths
    core_fonts_source_dir: "{{ project_root }}/fonts"

  environment:
    XDG_CONFIG_HOME: "{{ config_home }}"
    XDG_DATA_HOME: "{{ local_share }}"
    XDG_CACHE_HOME: "{{ cache_home }}"
    XDG_STATE_HOME: "{{ local_state }}"
    CARGO_HOME: "{{ cargo_home }}"
    RUSTUP_HOME: "{{ rustup_home }}"

  pre_tasks:
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ local_bin }}"
        - "{{ local_src }}"
        - "{{ local_share }}"
        - "{{ local_state }}"
        - "{{ config_home }}"
        - "{{ cache_home }}"

    - name: Update apt cache
      become: true
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

  # include_role does not pass the task's tags into the role; apply does.
  tasks:
    - name: Include core role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/core"
        apply:
          tags:
            - core
      tags:
        - core

    - name: Include dotfiles role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/dotfiles"
        apply:
          tags:
            - dotfiles
      tags:
        - dotfiles

    - name: Include gpg role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/gpg"
        apply:
          tags:
            - gpg
      tags:
        - gpg

    - name: Include docker role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/docker"
        apply:
          tags:
            - docker
      tags:
        - docker

    - name: Include mise role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/mise"
        apply:
          tags:
            - mise
      tags:
        - mise

    - name: Include zsh role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/zsh"
        apply:
          tags:
            - zsh
      tags:
        - zsh

    - name: Include gopass role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/gopass"
        apply:
          tags:
            - gopass
      tags:
        - gopass

    - name: Include browser role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/browser"
        apply:
          tags:
            - browser
      tags:
        - browser

    - name: Include rust role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/rust"
        apply:
          tags:
            - rust
      tags:
        - rust

    - name: Include python role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/python"
        apply:
          tags:
            - python
      tags:
        - python

    - name: Include neovim role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/neovim"
        apply:
          tags:
            - neovim
      tags:
        - neovim

    - name: Include tmux role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/tmux"
        apply:
          tags:
            - tmux
      tags:
        - tmux

    - name: Include i3blocks role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/i3blocks"
        apply:
          tags:
            - i3blocks
      tags:
        - i3blocks

    - name: Include ghostty role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/ghostty"
        apply:
          tags:
            - ghostty
      tags:
        - ghostty

    - name: Include picom role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/picom"
        apply:
          tags:
            - picom
      tags:
        - picom

    - name: Include i3lock_color role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/i3lock_color"
        apply:
          tags:
            - i3lock_color
      tags:
        - i3lock_color

    - name: Include desktop role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/desktop"
        apply:
          tags:
            - desktop
      tags:
        - desktop

    - name: Include claude_code role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/claude_code"
        apply:
          tags:
            - claude-code
      tags:
        - claude-code

    - name: Include herdr role
      ansible.builtin.include_role:
        name: "{{ project_root }}/roles/herdr"
        apply:
          tags:
            - herdr
      tags:
        - herdr
