---
dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml
    force: false

driver:
  name: docker

platforms:
  - name: ubuntu-resolute
    image: ubuntu:resolute
    pre_build_image: false
    dockerfile: Dockerfile.j2
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    verify: verify.yml
  inventory:
    host_vars:
      ubuntu-resolute:
        ansible_user: testuser
  options:
    skip-tags: gpg
  config_options:
    defaults:
      callbacks_enabled: ansible.posix.profile_tasks
      inject_facts_as_vars: false
      stdout_callback: default
      callback_result_format: yaml
      roles_path: ../../roles

verifier:
  name: ansible

scenario:
  name: default
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - cleanup
    - destroy
