---
- name: Check if Brave GPG key exists
  ansible.builtin.stat:
    path: /usr/share/keyrings/brave-browser-archive-keyring.gpg
  register: brave_gpg_key
  tags:
    - install
    - brave

- name: Download Brave GPG key
  ansible.builtin.get_url:
    url: https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
    dest: /usr/share/keyrings/brave-browser-archive-keyring.gpg
    mode: '0644'
  become: true
  when: not brave_gpg_key.stat.exists
  tags:
    - install
    - brave

- name: Add Brave apt repository
  vars:
    keyring: /usr/share/keyrings/brave-browser-archive-keyring.gpg
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ keyring }} arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main"
    filename: brave-browser-release
    state: present
  become: true
  tags:
    - install
    - brave

- name: Install Brave browser
  ansible.builtin.apt:
    name: brave-browser
    state: present
    update_cache: true
  become: true
  tags:
    - install
    - brave
