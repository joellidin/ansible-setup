- name: Set kubectl version
  set_fact: 
    kubectl_version: v1.29
  tags:
    - install
    - productivity
    - kubectl

- name: Download the Google Cloud public signing key
  shell: |
    curl -fsSL https://pkgs.k8s.io/core:/stable:/{{ kubectl_version }}/deb/Release.key | \
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true
  tags:
    - install
    - productivity
    - kubectl

- name: Add the Kubernetes apt repository
  shell: |
    echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubectl_version }}/deb/ /' | \
    tee /etc/apt/sources.list.d/kubernetes.list
  become: true
  tags:
    - install
    - productivity
    - kubectl

- name: Update apt and install kubectl
  become: true
  apt:
    update_cache: yes
    name: kubectl
  tags:
    - install
    - productivity
    - kubectl
