---
- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'
  become: true
  tags:
    - install
    - productivity
    - kubectl

- name: Check if Kubernetes GPG key exists
  ansible.builtin.stat:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  register: k8s_gpg_key
  tags:
    - install
    - productivity
    - kubectl

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ kubectl_version | default('v1.31') }}/deb/Release.key"
    dest: /tmp/kubernetes.gpg.asc
    mode: '0644'
  when: not k8s_gpg_key.stat.exists
  tags:
    - install
    - productivity
    - kubectl

- name: Dearmor and install Kubernetes GPG key
  ansible.builtin.shell: |
    gpg --dearmor < /tmp/kubernetes.gpg.asc > /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  become: true
  when: not k8s_gpg_key.stat.exists
  tags:
    - install
    - productivity
    - kubectl

- name: Set permissions on Kubernetes GPG key
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    mode: '0644'
  become: true
  when: not k8s_gpg_key.stat.exists
  tags:
    - install
    - productivity
    - kubectl

- name: Add Kubernetes apt repository
  vars:
    keyring: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    k8s_ver: "{{ kubectl_version | default('v1.31') }}"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ keyring }}] https://pkgs.k8s.io/core:/stable:/{{ k8s_ver }}/deb/ /"
    filename: kubernetes
    state: present
  become: true
  tags:
    - install
    - productivity
    - kubectl

- name: Install kubectl
  ansible.builtin.apt:
    name: kubectl
    state: present
    update_cache: true
  become: true
  tags:
    - install
    - productivity
    - kubectl
