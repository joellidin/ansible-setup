---
- name: Remove st
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/src/st"
    state: absent
  tags:
    - install
    - st

- name: Clone st
  become: true
  ansible.builtin.git:
    repo: 'https://github.com/joellidin/st.git'
    dest: "{{ lookup('env', 'HOME') }}/.local/src/st"
  tags:
    - install
    - st

- name: Build st
  become: true
  shell: make
  args:
    chdir: "{{ lookup('env', 'HOME') }}/.local/src/st"
  tags:
    - install
    - st

- name: Install st
  become: true
  shell: make clean install
  args:
    chdir: "{{ lookup('env', 'HOME') }}/.local/src/st"
  tags:
    - install
    - st

- name: Patch libxft
  import_tasks: tasks/libxft-setup.yml
  tags:
    - install
    - libxft
    - st
