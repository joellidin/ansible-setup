- name: regolith-linux
  become: true
  block:
    - name: Download foo.conf
      get_url:
        url: https://regolith-linux.github.io/package-repo/regolith.key
        dest: /etc/apt/trusted.gpg.d/regolith.asc
        mode: '0644'

    - name: Add the repositry url to apt
      shell: "echo deb '[arch=amd64] https://regolith-release-ubuntu-jammy-amd64.s3.amazonaws.com jammy main' | sudo tee /etc/apt/sources.list.d/regolith.list"

    - name: Update apt-get repo and cache
      apt: 
        update_cache: yes
  tags:
    - install
    - productivity

- name: git-core ppa (ppa:git-core/ppa)
  become: true
  apt_repository:
   repo: ppa:git-core/ppa
   state: present
   update_cache: True
  tags:
    - install
    - productivity

- name: Install Productivity Packages
  become: true
  package:
    name: ["xcape", "ffmpeg", "maim", "imagemagick", "jq", "xclip", "xwallpaper", "fzf", "rofi", "acpi", "unclutter", "xcompmgr", "sqlite3", "libsqlite3-dev", "ripgrep", "i3-gaps", "python3-pip", "wget", "git", "fd-find"]
  tags:
    - install
    - productivity

- name: Install Packages for Yubico
  become: true
  package:
    name: ["scdaemon", "yubikey-manager", "libpam-yubico", "libpam-u2f", "libu2f-udev"]
  tags:
    - install
    - productivity

- name: Install Git Delta
  shell: curl -L -s https://api.github.com/repos/dandavison/delta/releases/latest | grep -o -E "https://(.*)git-delta_(.*)_amd64.deb" | xargs -n 1 curl -fsSL -O && ls | grep -o -E "git-delta_(.*)amd64.deb" | xargs -n 1 dpkg -i 
  args:
    chdir: /tmp
  become: true
  tags:
    - install
    - productivity
