---
# deb822_repository instead of apt_repository: the latter is deprecated and its
# PPA key import via apt-key/hkp no longer works on Ubuntu 26.04 (apt 3.x).
# Key fingerprint from https://launchpad.net/api/1.0/~git-core/+archive/ubuntu/ppa
- name: Add git-core PPA
  become: true
  ansible.builtin.deb822_repository:
    name: git-core-ubuntu-ppa
    types: deb
    uris: https://ppa.launchpadcontent.net/git-core/ppa/ubuntu/
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: main
    signed_by: "https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&exact=on&search=0xF911AB184317630C59970973E363C90F8F1B6217"
    state: present
  register: git_core_ppa
  tags:
    - install
    - productivity

- name: Refresh apt cache after adding the git-core PPA
  become: true
  ansible.builtin.apt:
    update_cache: true
  when: git_core_ppa.changed
  tags:
    - install
    - productivity

- name: Install Productivity Packages
  become: true
  ansible.builtin.apt:
    name:
      - xcape
      - xdotool
      - ffmpeg
      - maim
      - imagemagick
      - jq
      - xclip
      - xwallpaper
      - fzf
      - rofi
      - acpi
      - unclutter

      - sqlite3
      - libsqlite3-dev
      - ripgrep
      - i3
      - python3-pip
      - git
      - fd-find
      - plocate
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - productivity
