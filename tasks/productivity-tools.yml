---
- name: Install wget
  become: true
  ansible.builtin.package:
    name: wget
  tags:
    - install
    - productivity

- name: Add git-core PPA
  become: true
  ansible.builtin.apt_repository:
    repo: ppa:git-core/ppa
    state: present
  tags:
    - install
    - productivity

- name: Install Productivity Packages
  become: true
  ansible.builtin.apt:
    name:
      - curl
      - xcape
      - xdotool
      - ffmpeg
      - maim
      - imagemagick
      - jq
      - xclip
      - xwallpaper
      - fzf
      - rofi
      - acpi
      - unclutter
      - xcompmgr
      - sqlite3
      - libsqlite3-dev
      - ripgrep
      - i3-gaps
      - python3-pip
      - git
      - fd-find
      - plocate
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - productivity

- name: Check if Git Delta is installed
  ansible.builtin.command: which delta
  register: delta_installed
  changed_when: false
  failed_when: false
  tags:
    - install
    - productivity

- name: Install Git Delta
  ansible.builtin.shell: |
    curl -L -s https://api.github.com/repos/dandavison/delta/releases/latest |
    grep -o -E "https://(.*)git-delta_(.*)_amd64.deb" |
    xargs -n 1 curl -fsSL -O &&
    ls | grep -o -E "git-delta_(.*)amd64.deb" | xargs -n 1 dpkg -i
  args:
    chdir: /tmp
  become: true
  when: delta_installed.rc != 0
  tags:
    - install
    - productivity
