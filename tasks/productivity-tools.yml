---
- name: Install wget
  become: true
  package:
    name: wget
  tags:
    - install
    - productivity

- name: regolith-linux
  become: true
  block:
    - name: Download regolith key
      shell: |
        wget -qO - https://regolith-desktop.org/regolith.key | \
        gpg --dearmor | sudo tee /usr/share/keyrings/regolith-archive-keyring.gpg > /dev/null

    - name: Add the repositry url to apt
      shell: |
        echo deb "[arch=amd64 signed-by=/usr/share/keyrings/regolith-archive-keyring.gpg] \
        https://regolith-desktop.org/release-ubuntu-jammy-amd64 jammy main" | \
        sudo tee /etc/apt/sources.list.d/regolith.list
  tags:
    - install
    - productivity

- name: git-core ppa (ppa:git-core/ppa)
  become: true
  shell: add-apt-repository ppa:git-core/ppa -y
  tags:
    - install
    - productivity

- name: Update apt-get repo and cache
  become: true
  apt:
    update_cache: yes
  tags:
    - install
    - productivity

- name: Install Productivity Packages
  become: true
  package:
    name:
      - curl
      - xcape
      - xdotool
      - ffmpeg
      - maim
      - imagemagick
      - jq
      - xclip
      - xwallpaper
      - fzf
      - rofi
      - acpi
      - unclutter
      - xcompmgr
      - sqlite3
      - libsqlite3-dev
      - ripgrep
      - i3-gaps
      - python3-pip
      - git
      - fd-find
      - plocate
  tags:
    - install
    - productivity

- name: Install Packages for Yubico
  become: true
  package:
    name:
      - scdaemon
      - yubikey-manager
      - libpam-yubico
      - libpam-u2f
      - libu2f-udev
  tags:
    - install
    - productivity

- name: Install Git Delta
  shell: |
    curl -L -s https://api.github.com/repos/dandavison/delta/releases/latest |
    grep -o -E "https://(.*)git-delta_(.*)_amd64.deb" |
    xargs -n 1 curl -fsSL -O &&
    ls | grep -o -E "git-delta_(.*)amd64.deb" | xargs -n 1 dpkg -i
  args:
    chdir: /tmp
  become: true
  tags:
    - install
    - productivity

- name: Copy public key
  copy:
    src: "./encrypt-data/pub.key"
    dest: /tmp/pub.key
    mode: preserve
  tags:
    - install
    - gpg
    - productivity


- name: Import Yubikey gpg key
  shell: gpg --import /tmp/pub.key
  tags:
    - install
    - gpg
    - productivity

- name: Trust key
  shell: echo "A7A5F7E1CB6C0E868E98445899B478EFF8ED88CD:6:" | gpg --import-ownertrust
  tags:
    - install
    - gpg
    - productivity
