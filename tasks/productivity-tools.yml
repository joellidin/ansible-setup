---
- name: Add git-core PPA
  become: true
  ansible.builtin.apt_repository:
    repo: ppa:git-core/ppa
    state: present
  tags:
    - install
    - productivity

- name: Install Productivity Packages
  become: true
  ansible.builtin.apt:
    name:
      - xcape
      - xdotool
      - ffmpeg
      - maim
      - imagemagick
      - jq
      - xclip
      - xwallpaper
      - fzf
      - rofi
      - acpi
      - unclutter

      - sqlite3
      - libsqlite3-dev
      - ripgrep
      - i3
      - python3-pip
      - git
      - fd-find
      - plocate
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - productivity
