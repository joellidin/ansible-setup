- name: Create Directory for Sumneko-lua
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.cache/nvim/nlua/sumneko_lua"
    state: directory

- name: Remove Sumneko-lua folder
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.cache/nvim/nlua/sumneko_lua/lua-language-server"
    state: absent

- name: Clone Sumneko-lua
  ansible.builtin.git:
    repo: "https://github.com/sumneko/lua-language-server.git"
    dest: "{{ lookup('env', 'HOME') }}/.cache/nvim/nlua/sumneko_lua/lua-language-server"
    recursive: yes
    update: yes

- name: Install with luamake
  shell: ./compile/install.sh
  args:
    chdir: "{{ lookup('env', 'HOME') }}/.cache/nvim/nlua/sumneko_lua/lua-language-server/3rd/luamake"

- name: Rebuild with luamake
  shell: ./3rd/luamake/luamake rebuild
  args:
    chdir: "{{ lookup('env', 'HOME') }}/.cache/nvim/nlua/sumneko_lua/lua-language-server"

- name: Create Directory for Linux
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.cache/nvim/nlua/sumneko_lua/lua-language-server/bin/Linux"
    state: directory

- name: Copy binary files
  ansible.builtin.copy:
    src: "{{ lookup('env', 'HOME') }}/.cache/nvim/nlua/sumneko_lua/lua-language-server/bin/{{item}}"
    dest: "{{ lookup('env', 'HOME') }}/.cache/nvim/nlua/sumneko_lua/lua-language-server/bin/Linux/{{item}}"
    mode: preserve
  with_items: 
    ['main.lua', 'lua-language-server']
