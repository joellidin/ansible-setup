- name: Check current Go version
  command: "{{ go_install_path | default('/usr/local/go') }}/bin/go version"
  register: go_version_check
  changed_when: false
  failed_when: false
  tags:
    - install
    - go

- name: Extract installed Go version
  set_fact:
    go_installed_version: "{{ go_version_check.stdout | regex_search('go([0-9.]+)', '\\1') | first | default('0') }}"
  when: go_version_check.rc == 0
  tags:
    - install
    - go

- name: Set Go needs install
  set_fact:
    go_needs_install: "{{ go_version_check.rc != 0 or (go_installed_version | default('0')) is version(go_version | default('1.23.4'), '<') }}"
  tags:
    - install
    - go

- name: Download Go tarball
  get_url:
    url: "{{ go_download_url | default('https://go.dev/dl/go' + (go_version | default('1.23.4')) + '.linux-amd64.tar.gz') }}"
    dest: "/tmp/go{{ go_version | default('1.23.4') }}.linux-amd64.tar.gz"
    checksum: "{{ go_checksum | default(omit) }}"
    mode: '0440'
  when: go_needs_install
  tags:
    - install
    - go

- name: Remove old Go installation
  file:
    path: "{{ go_install_path | default('/usr/local/go') }}"
    state: absent
  become: true
  when: go_needs_install
  tags:
    - install
    - go

- name: Extract Go tarball
  unarchive:
    src: "/tmp/go{{ go_version | default('1.23.4') }}.linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: yes
  become: true
  when: go_needs_install
  tags:
    - install
    - go

- name: Clean up Go tarball
  file:
    path: "/tmp/go{{ go_version | default('1.23.4') }}.linux-amd64.tar.gz"
    state: absent
  when: go_needs_install
  tags:
    - install
    - go
