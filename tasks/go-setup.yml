---
- name: Check current Go version
  ansible.builtin.command: "{{ go_install_path | default('/usr/local/go') }}/bin/go version"
  register: go_version_check
  changed_when: false
  failed_when: false
  tags:
    - install
    - go

- name: Extract installed Go version
  ansible.builtin.set_fact:
    go_installed_version: "{{ go_version_check.stdout | regex_search('go([0-9.]+)', '\\1') | first | default('0') }}"
  when: go_version_check.rc == 0
  tags:
    - install
    - go

- name: Set Go needs install
  ansible.builtin.set_fact:
    go_needs_install: >-
      {{ go_version_check.rc != 0 or
         (go_installed_version | default('0')) is version(go_version | default('1.23.4'), '<') }}
  tags:
    - install
    - go

- name: Download Go tarball
  vars:
    go_ver: "{{ go_version | default('1.23.4') }}"
    default_url: "https://go.dev/dl/go{{ go_ver }}.linux-amd64.tar.gz"
  ansible.builtin.get_url:
    url: "{{ go_download_url | default(default_url) }}"
    dest: "/tmp/go{{ go_ver }}.linux-amd64.tar.gz"
    checksum: "{{ go_checksum | default(omit) }}"
    mode: '0440'
  when: go_needs_install
  tags:
    - install
    - go

- name: Remove old Go installation
  ansible.builtin.file:
    path: "{{ go_install_path | default('/usr/local/go') }}"
    state: absent
  become: true
  when: go_needs_install
  tags:
    - install
    - go

- name: Extract Go tarball
  ansible.builtin.unarchive:
    src: "/tmp/go{{ go_version | default('1.23.4') }}.linux-amd64.tar.gz"
    dest: /usr/local
    remote_src: yes
  become: true
  when: go_needs_install
  tags:
    - install
    - go

- name: Clean up Go tarball
  ansible.builtin.file:
    path: "/tmp/go{{ go_version | default('1.23.4') }}.linux-amd64.tar.gz"
    state: absent
  when: go_needs_install
  tags:
    - install
    - go
