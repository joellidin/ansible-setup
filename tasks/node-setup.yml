---
- name: Install nodejs and npm
  become: true
  ansible.builtin.apt:
    name: ["nodejs", "npm"]
  tags:
    - install
    - node

- name: Install Temporary npm Configs
  block:
    - name: Set prefix
      ansible.builtin.shell: npm config set prefix "{{ lookup('env', 'HOME') }}/.local/share/npm"

    - name: Set cache
      ansible.builtin.shell: npm config set cache "{{ lookup('env', 'HOME') }}/.cache/npm"
  tags:
    - install
    - node

- name: Install N
  npm:
    name: n
    global: yes
  tags:
    - install
    - node

- name: Install correct version of Node
  ansible.builtin.shell: "{{ lookup('env', 'HOME') }}/.local/share/npm/bin/n 16"
  tags:
    - install
    - node

- name: Remove Temporary Configs
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.config/npm/npmrc"
    state: absent
  tags:
    - install
    - node
