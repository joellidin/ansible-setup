- name: Remove tmux
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/src/tmux"
    state: absent
  tags:
    - install
    - productivity
    - tmux

- name: Clone Tmux
  become: true
  ansible.builtin.git:
    repo: "https://github.com/tmux/tmux.git"
    dest: "{{ lookup('env', 'HOME') }}/.local/src/tmux"
  tags:
    - install
    - productivity
    - tmux

- name: Configure Tmux
  become: true
  shell: sh autogen.sh && ./configure && make
  args:
    chdir: "{{ lookup('env', 'HOME') }}/.local/src/tmux"
  tags:
    - install
    - productivity
    - tmux

- name: Install Tmux
  become: true
  make:
    chdir: "{{ lookup('env', 'HOME') }}/.local/src/tmux"
    target: install
  tags:
    - install
    - productivity
    - tmux
