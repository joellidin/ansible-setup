- name: Download gopass deb package
  get_url:
    url: https://github.com/gopasspw/gopass/releases/download/v1.15.5/gopass_1.15.5_linux_amd64.deb
    dest: /tmp
  tags:
    - install
    - gopass

- name: Install gopass
  become: true
  apt:
    deb: /tmp/gopass_1.15.5_linux_amd64.deb
  tags:
    - install
    - gopass

- name: Change owner and group of gopass binary
  become: true
  ansible.builtin.file:
    path: /usr/bin/gopass
    owner: "{{ ansible_user_id }}"
    group: "{{ ansible_user_id }}"
  tags:
    - install
    - gopass

- name: Move gopass to user
  become: true
  shell: "mv /usr/bin/gopass /home/{{ ansible_user_id }}/.local/bin/"
  tags:
    - install
    - gopass

- name: Add completion
  block:
    - name: Create gopass directory in oh-my-zsh
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.local/src/oh-my-zsh/plugins/gopass"
        state: directory

    - name: Add gopass completion
      shell: "{{ lookup('env', 'HOME') }}/.local/bin/gopass completion zsh > _gopass"
      args:
        chdir: "{{ lookup('env', 'HOME') }}/.local/src/oh-my-zsh/plugins/gopass"
  tags:
    - install
    - gopass


- name: Install default password store
  block:
    - name: Create gopass directory
      ansible.builtin.file:
        path: "{{ lookup('env', 'HOME') }}/.local/share/gopass/stores/root"
        state: directory

    - name: clone into repo
      ansible.builtin.git:
        repo: "https://github.com/joellidin/private-pass.git"
        dest: "{{ lookup('env', 'HOME') }}/.local/share/gopass/stores/root"
  tags:
    - install
    - gopass
