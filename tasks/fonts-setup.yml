---
- name: Create fonts folder if it does not exist
  ansible.builtin.file:
    path: "{{ local_share | default(ansible_env.HOME + '/.local/share') }}/fonts"
    state: directory
    mode: '0755'
  tags:
    - install
    - core
    - fonts

- name: Copy fonts to fonts folder
  ansible.builtin.copy:
    src: "{{ project_root | default(playbook_dir) }}/fonts/"
    dest: "{{ local_share | default(ansible_env.HOME + '/.local/share') }}/fonts"
    mode: preserve
  register: fonts_copied
  tags:
    - install
    - core
    - fonts

- name: Install fonts
  ansible.builtin.command: fc-cache -frv
  when: fonts_copied.changed
  changed_when: true
  tags:
    - install
    - core
    - fonts
