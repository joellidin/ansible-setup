---
- name: Install ZSH
  ansible.builtin.package:
    name: zsh
    state: present
  become: true
  tags:
    - install
    - productivity
    - dotfiles
    - zsh

- name: Change shell to zsh
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /usr/bin/zsh
  become: true
  tags:
    - install
    - productivity
    - dotfiles
    - zsh

- name: Check if oh-my-zsh exists
  ansible.builtin.stat:
    path: "{{ oh_my_zsh_path | default(ansible_env.HOME + '/.local/src/oh-my-zsh') }}"
  register: oh_my_stats
  tags:
    - install
    - productivity
    - dotfiles
    - zsh

- name: Install Oh-My-Zsh
  ansible.builtin.shell: |
    sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" -s -- --unattended
  environment:
    ZSH: "{{ oh_my_zsh_path | default(ansible_env.HOME + '/.local/src/oh-my-zsh') }}"
  when: not oh_my_stats.stat.exists
  tags:
    - install
    - productivity
    - dotfiles
    - zsh

- name: Install zsh-autosuggestions
  vars:
    omz: "{{ oh_my_zsh_path | default(ansible_env.HOME + '/.local/src/oh-my-zsh') }}"
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-autosuggestions.git"
    dest: "{{ omz }}/custom/plugins/zsh-autosuggestions"
    update: true
  tags:
    - install
    - productivity
    - dotfiles
    - zsh

- name: Install zsh-fzf-history-search
  vars:
    omz: "{{ oh_my_zsh_path | default(ansible_env.HOME + '/.local/src/oh-my-zsh') }}"
  ansible.builtin.git:
    repo: "https://github.com/joshskidmore/zsh-fzf-history-search.git"
    dest: "{{ omz }}/custom/plugins/zsh-fzf-history-search"
    update: true
  tags:
    - install
    - productivity
    - dotfiles
    - zsh

- name: Install zsh-syntax-highlighting
  vars:
    omz: "{{ oh_my_zsh_path | default(ansible_env.HOME + '/.local/src/oh-my-zsh') }}"
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    dest: "{{ omz }}/custom/plugins/zsh-syntax-highlighting"
    update: true
  tags:
    - install
    - productivity
    - dotfiles
    - zsh

- name: Check if Starship is installed
  ansible.builtin.command: starship --version
  register: starship_installed
  changed_when: false
  failed_when: false
  tags:
    - install
    - productivity
    - dotfiles
    - zsh
    - starship

- name: Download Starship installer
  ansible.builtin.get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship.sh
    mode: '0755'
  when: starship_installed.rc != 0
  tags:
    - install
    - productivity
    - dotfiles
    - zsh
    - starship

- name: Install Starship
  ansible.builtin.shell: sh /tmp/starship.sh -y
  when: starship_installed.rc != 0
  tags:
    - install
    - productivity
    - dotfiles
    - zsh
    - starship

- name: Create ZSH state directory
  ansible.builtin.file:
    path: "{{ local_state | default(ansible_env.HOME + '/.local/state') }}/zsh"
    state: directory
    mode: '0755'
  tags:
    - install
    - productivity
    - dotfiles
    - zsh

- name: Create ZSH history file
  ansible.builtin.file:
    path: "{{ local_state | default(ansible_env.HOME + '/.local/state') }}/zsh/history"
    state: touch
    mode: '0600'
    modification_time: preserve
    access_time: preserve
  tags:
    - install
    - productivity
    - dotfiles
    - zsh
