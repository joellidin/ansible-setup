- name: Install ZSH
  package:
    name:
      - zsh
  become: true
  tags: &tags_for_zsh_tasks [ 'install', 'productivity', 'dotfiles', 'zsh' ]
    
- name: Change shell to zsh
  become: true
  shell: "chsh -s $(which zsh) {{ ansible_user_id }}"
  tags: *tags_for_zsh_tasks

- name: Check that oh-my-zsh exists
  stat:
    path: "{{ lookup('env', 'HOME')}}/.local/src/oh-my-zsh"
  register: oh_my_stats
  tags: *tags_for_zsh_tasks

- name: Oh-My-Zsh
  shell: sh -c "$(curl -fsSL https://raw.github.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" -s -- --unattended
  tags: *tags_for_zsh_tasks
  when: oh_my_stats.stat.exists == False
  environment:
    ZSH: "{{ lookup('env', 'HOME') }}/.local/src/oh-my-zsh"

- name: Install zsh-autosuggestions
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-autosuggestions.git"
    dest: "{{ lookup('env', 'HOME')}}/.local/src/oh-my-zsh/custom/plugins/zsh-autosuggestions"
  tags: *tags_for_zsh_tasks

- name: Install zsh-fzf-history-search
  ansible.builtin.git:
    repo: "https://github.com/joshskidmore/zsh-fzf-history-search.git"
    dest: "{{ lookup('env', 'HOME')}}/.local/src/oh-my-zsh/custom/plugins/zsh-fzf-history-search"
  tags: *tags_for_zsh_tasks

- name: Download Starship Prompt Theme
  ansible.builtin.get_url:
    url: https://starship.rs/install.sh
    dest: /tmp/starship.sh
    mode: 0755
  tags: 
    - *tags_for_zsh_tasks
    - starship

- name: Install Starship Prompt Theme
  shell: cat /tmp/starship.sh | sh -s -- -y
  tags: 
    - *tags_for_zsh_tasks
    - starship

- name: Install zsh-syntax-highlighting
  ansible.builtin.git:
    repo: "https://github.com/zsh-users/zsh-syntax-highlighting.git"
    dest: "{{ lookup('env', 'HOME')}}/.local/src/oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
  tags: *tags_for_zsh_tasks

- name: Create State ZSH Directory
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME')}}/.local/state/zsh"
    state: directory
  tags: *tags_for_zsh_tasks

- name: Create History File
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME')}}/.local/state/zsh/history"
    state: touch
  tags: *tags_for_zsh_tasks
