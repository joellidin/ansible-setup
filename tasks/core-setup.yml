---
- name: Install Build Requirements for Neovim
  become: true
  ansible.builtin.apt:
    name:
      - ninja-build
      - gettext
      - libtool
      - libtool-bin
      - autoconf
      - automake
      - cmake
      - g++
      - pkg-config
      - unzip
      - curl
      - doxygen
      - build-essential
    state: present
    update_cache: true
    cache_valid_time: 3600
  tags:
    - install
    - neovim
    - core

- name: Install Build Requirements for st
  become: true
  ansible.builtin.package:
    name:
      - libx11-dev
      - xutils-dev
      - autoconf
      - make
      - pkg-config
      - libfontconfig1-dev
      - libharfbuzz-dev
      - libxft-dev
      - libtool
  tags:
    - install
    - st
    - core

- name: Install Build Requirements for eww
  become: true
  ansible.builtin.package:
    name:
      - libglib2.0-dev
      - libcairo2-dev
      - libgdk-pixbuf2.0-dev
      - libpango1.0-dev
      - libgdk3.0-cil-dev
      - libgtk-3-dev
      - libdbusmenu-glib-dev
      - libdbusmenu-gtk3-dev
  tags:
    - install
    - eww

- name: Install Build Requirements for tmux
  become: true
  ansible.builtin.package:
    name:
      - libevent-dev
      - libncurses5-dev
      - libncursesw5-dev
      - autoconf
      - automake
      - bison
      - byacc
      - pkg-config
  tags:
    - install
    - productivity
    - tmux

- name: Install fonts
  ansible.builtin.import_tasks: "{{ project_root | default(playbook_dir) }}/tasks/fonts-setup.yml"
  tags:
    - install
    - core
    - fonts
