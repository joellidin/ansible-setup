---
# Parallel git clones for build-from-source tools
# This significantly speeds up initial setup by cloning repos concurrently

- name: Define repositories to clone
  ansible.builtin.set_fact:
    build_repos:
      - repo: "{{ neovim_repo | default('https://github.com/neovim/neovim.git') }}"
        dest: "{{ local_src | default(ansible_env.HOME + '/.local/src') }}/neovim"
        version: stable
      - repo: "{{ tmux_repo | default('https://github.com/tmux/tmux.git') }}"
        dest: "{{ local_src | default(ansible_env.HOME + '/.local/src') }}/tmux"
        version: master
      - repo: "{{ i3blocks_repo | default('https://github.com/vivien/i3blocks') }}"
        dest: "{{ local_src | default(ansible_env.HOME + '/.local/src') }}/i3blocks"
        version: master
  tags:
    - install
    - build
    - parallel-clone

- name: Clone repositories in parallel
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "{{ item.dest }}"
    version: "{{ item.version }}"
    update: true
    force: false
  loop: "{{ build_repos }}"
  async: 300
  poll: 0
  register: clone_jobs
  tags:
    - install
    - build
    - parallel-clone

- name: Wait for all clones to complete
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  loop: "{{ clone_jobs.results }}"
  register: job_result
  until: job_result.finished
  retries: 30
  delay: 10
  tags:
    - install
    - build
    - parallel-clone
