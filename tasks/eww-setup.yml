- name: Remove eww
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/src/eww"
    state: absent
  tags:
    - install
    - eww

- name: Clone eww
  ansible.builtin.git:
    repo: 'https://github.com/elkowar/eww.git'
    dest: "{{ lookup('env', 'HOME') }}/.local/src/eww"
  tags:
    - install
    - eww

- name: Install eww
  shell: . ~/.config/cargo/env && cargo build --release
  args:
    chdir: "{{ lookup('env', 'HOME') }}/.local/src/eww"
  tags:
    - install
    - eww

- name: Symlink to /usr/bin
  become: true
  file:
    src: "{{ lookup('env', 'HOME') }}/.local/src/eww/target/release/eww" 
    dest: /usr/bin/eww
    state: link
  tags:
    - install
    - eww
