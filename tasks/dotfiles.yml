---
- name: Cloning .dotfiles
  ansible.builtin.git:
    repo: "https://github.com/joellidin/dotfiles.git"
    dest: "{{ ansible_env.HOME }}/.dotfiles"
    bare: yes
    update: yes
    accept_hostkey: yes
    version: main
  tags:
    - install
    - dotfiles

- name: Create Backup Directory for Configs
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config-backup"
    state: directory
  tags:
    - install
    - dotfiles

- name: Backup Existing Configs
  vars:
    dotfiles_dir: "{{ ansible_env.HOME }}/.dotfiles"
    home: "{{ ansible_env.HOME }}"
  ansible.builtin.shell: |
    /usr/bin/git --git-dir={{ dotfiles_dir }}/ --work-tree={{ home }} checkout 2>&1 |
    egrep '\s+\.' | awk {'print $1'} |
    xargs -I{} mv {{ home }}/$(basename {}) {{ home }}/.config-backup/
  tags:
    - install
    - dotfiles

- name: Check if Backup Directory is Empty
  ansible.builtin.find:
    paths: "{{ ansible_env.HOME }}/.config-backup"
  register: filesFound
  tags:
    - install
    - dotfiles

- name: Remove Backup Direcotry
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config-backup"
    state: absent
  when: filesFound.matched == 0
  tags:
    - install
    - dotfiles

- name: Install Dotfiles Configs
  vars:
    dotfiles_dir: "{{ ansible_env.HOME }}/.dotfiles"
    home: "{{ ansible_env.HOME }}"
  ansible.builtin.shell: /usr/bin/git --git-dir={{ dotfiles_dir }}/ --work-tree={{ home }} checkout
  tags:
    - install
    - dotfiles

- name: Hide Untracked Files
  vars:
    dotfiles_dir: "{{ ansible_env.HOME }}/.dotfiles"
    home: "{{ ansible_env.HOME }}"
  ansible.builtin.shell: |
    /usr/bin/git --git-dir={{ dotfiles_dir }}/ --work-tree={{ home }} \
      config --local status.showUntrackedFiles no
  tags:
    - install
    - dotfiles
